<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Compact and send</title>
    <link rel="stylesheet" href="./tokens.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 2rem;
        background: var(--color-app);
        color: var(--color-foreground);
        font-family: var(--font-app);
        font-size: 1rem;
      }
      main {
        max-width: 38rem;
        margin: auto;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 500;
        margin: 0 0 2rem;
      }
      section {
        border-top: 1px solid var(--color-border);
        padding: 1.5rem 0;
        display: flex;
        gap: 2rem;
        align-items: center;
        flex-wrap: wrap;
      }
      figure {
        margin: 0;
        display: grid;
        justify-items: center;
        gap: 1rem;
      }
      figcaption {
        font-size: 0.75rem;
        color: var(--color-muted);
      }
      button {
        width: 2rem;
        height: 2rem;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: var(--color-accent);
        color: var(--color-on-accent);
        display: grid;
        place-items: center;
      }
      svg {
        display: block;
      }
      button:focus-visible {
        outline: 2px solid var(--color-primary);
        outline-offset: 0.25rem;
      }
    </style>
