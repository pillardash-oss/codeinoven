<svg xmlns="http://www.w3.org/2000/svg" style="display: none">
  <!--
    DIRECTION D - "The Cut Block"
    The slab's mass with the wire's drawing discipline. Every glyph is a solid
    form whose meaning is cut out of it, rounded at every corner, with the
    counters drawn as generously as the material. One solid colour, no ember.
    Where the slab was a hard brick with rectangular holes, this is a die-cut:
    the opening carries as much of the shape as the ink does.
  -->
  <symbol id="d-projects" viewBox="0 0 24 24" fill="currentColor" stroke="none">
    <!-- The folder's own silhouette, cut as one solid form: a tab in the lid and
         a door below it. The opening is 8x5.5 units so it survives 16px as a
         shape rather than a slot, and the silhouette separates this glyph from
         Browser, which is a plain slab.
         The door rect is written clockwise against the body's counter-clockwise
         outer edge, so even-odd and non-zero agree on which part is the hole. -->
    <path
      fill-rule="evenodd"
      d="M6 4 H11.5 A2.5 2.5 0 0 1 14 6.5 V7 H18 A2.5 2.5 0 0 1 20.5 9.5 V17 A2.5 2.5 0 0 1 18 19.5 H6 A2.5 2.5 0 0 1 3.5 17 V6.5 A2.5 2.5 0 0 1 6 4 Z M8 11 H13 A1.5 1.5 0 0 1 14.5 12.5 V15 A1.5 1.5 0 0 1 13 16.5 H8 A1.5 1.5 0 0 1 6.5 15 V12.5 A1.5 1.5 0 0 1 8 11 Z"
    />
  </symbol>

  <symbol id="d-threads" viewBox="0 0 24 24" fill="currentColor" stroke="none">
    <!-- The thread: three entries cut as bars, tapering as they age. -->
    <rect x="3.5" y="5" width="17" height="3.4" rx="1.2" />
    <rect x="3.5" y="10.1" width="13" height="3.4" rx="1.2" />
    <rect x="3.5" y="15.2" width="9" height="3.4" rx="1.2" />
  </symbol>

  <symbol id="d-scoped" viewBox="0 0 24 24" fill="currentColor" stroke="none">
    <!-- The scope: a field with a region selected inside it. The region is solid
         rather than empty, which is what keeps it apart from Browser's window
         at 16px, where two nested outlines would read the same. -->
    <path
      fill-rule="evenodd"
      d="M6 3.5 H18 A2.5 2.5 0 0 1 20.5 6 V18 A2.5 2.5 0 0 1 18 20.5 H6 A2.5 2.5 0 0 1 3.5 18 V6 A2.5 2.5 0 0 1 6 3.5 Z M9.5 8 H14.5 A1.5 1.5 0 0 1 16 9.5 V14.5 A1.5 1.5 0 0 1 14.5 16 H9.5 A1.5 1.5 0 0 1 8 14.5 V9.5 A1.5 1.5 0 0 1 9.5 8 Z"
    />
    <rect x="10" y="10" width="4" height="4" rx="1" />
  </symbol>

  <symbol id="d-board" viewBox="0 0 24 24" fill="currentColor" stroke="none">
    <!-- The board: a header bar and three columns of unequal drop. -->
    <rect x="3.5" y="4.5" width="17" height="3" rx="1.2" />
    <rect x="5" y="9.5" width="3.6" height="9" rx="1.4" />
    <rect x="10.2" y="9.5" width="3.6" height="11" rx="1.4" />
    <rect x="15.4" y="9.5" width="3.6" height="6.5" rx="1.4" />
  </symbol>

  <symbol id="d-chats" viewBox="0 0 24 24" fill="currentColor" stroke="none">
    <!-- The bubble: a cut bubble with a tail, the line spoken knocked through. -->
    <path
      fill-rule="evenodd"
      d="M3.5 8.5 A2.5 2.5 0 0 1 6 6 H18 A2.5 2.5 0 0 1 20.5 8.5 V14.5 A2.5 2.5 0 0 1 18 17 H11 L6.5 21 V17 H6 A2.5 2.5 0 0 1 3.5 14.5 Z
         M7 9.5 H16.4 A1.5 1.5 0 0 1 17.9 11 A1.5 1.5 0 0 1 16.4 12.5 H7 A1.5 1.5 0 0 1 5.5 11 A1.5 1.5 0 0 1 7 9.5 Z"
    />
  </symbol>

  <symbol id="d-browser" viewBox="0 0 24 24" fill="currentColor" stroke="none">
    <!-- The page: a plain slab with one wide window struck out of it. A title
         band was tried and dropped: at 16px the ink between two stacked holes
         falls under a pixel and the two merge into one shape. -->
    <path
      fill-rule="evenodd"
      d="M6 4.5 H18 A2.5 2.5 0 0 1 20.5 7 V17 A2.5 2.5 0 0 1 18 19.5 H6 A2.5 2.5 0 0 1 3.5 17 V7 A2.5 2.5 0 0 1 6 4.5 Z M8 9 H16 A1.5 1.5 0 0 1 17.5 10.5 V13.5 A1.5 1.5 0 0 1 16 15 H8 A1.5 1.5 0 0 1 6.5 13.5 V10.5 A1.5 1.5 0 0 1 8 9 Z"
    />
  </symbol>

  <symbol id="d-info" viewBox="0 0 24 24" fill="currentColor" stroke="none">
    <!-- The readout: a cut plate with its mark struck through it. -->
    <path
      fill-rule="evenodd"
      d="M6 5.5 H18 A2.5 2.5 0 0 1 20.5 8 V16 A2.5 2.5 0 0 1 18 18.5 H6 A2.5 2.5 0 0 1 3.5 16 V8 A2.5 2.5 0 0 1 6 5.5 Z
         M12 8 A1.7 1.7 0 0 1 13.7 9.7 A1.7 1.7 0 0 1 12 11.4 A1.7 1.7 0 0 1 10.3 9.7 A1.7 1.7 0 0 1 12 8 Z
         M12 12.6 A1 1 0 0 1 13 13.6 V14.4 A1 1 0 0 1 12 15.4 A1 1 0 0 1 11 14.4 V13.6 A1 1 0 0 1 12 12.6 Z"
    />
  </symbol>

  <symbol id="d-gauge" viewBox="0 0 24 24" fill="currentColor" stroke="none">
    <!-- The task rack: a solid machine with three running slots cut out of it.
         Equal lanes, so it cannot be mistaken for Thread's tapering bars, and
         solid walls, so it cannot be mistaken for Browser's single window. -->
    <path
      fill-rule="evenodd"
      d="M6 3.5 H18 A2.5 2.5 0 0 1 20.5 6 V18 A2.5 2.5 0 0 1 18 20.5 H6 A2.5 2.5 0 0 1 3.5 18 V6 A2.5 2.5 0 0 1 6 3.5 Z M5.5 6.5 H18.5 V9.5 H5.5 Z M5.5 10.9 H18.5 V13.1 H5.5 Z M5.5 14.5 H18.5 V17.5 H5.5 Z"
    />
  </symbol>

  <symbol id="d-plug" viewBox="0 0 24 24" fill="currentColor" stroke="none">
    <!-- The plug: a cut body with two pins. -->
    <rect x="6.5" y="11.5" width="11" height="8" rx="2" />
    <rect x="8.4" y="4.5" width="2.6" height="8.5" rx="1.3" />
    <rect x="13" y="4.5" width="2.6" height="8.5" rx="1.3" />
  </symbol>

  <symbol id="d-settings" viewBox="0 0 24 24" fill="currentColor" stroke="none">
    <!-- The console: the four panels settings is made of. -->
    <rect x="3.5" y="4.5" width="7.5" height="6.5" rx="1.5" />
    <rect x="13" y="4.5" width="7.5" height="6.5" rx="1.5" />
    <rect x="3.5" y="13" width="7.5" height="6.5" rx="1.5" />
    <rect x="13" y="13" width="7.5" height="6.5" rx="1.5" />
  </symbol>
</svg>
