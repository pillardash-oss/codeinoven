<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!--
    Browser candidates in the construction the owner asked for: one solid disc of
    ink with its meaning knocked out of it, single colour, no outline.

    Measured from the reference they dropped: a solid disc 260 px across with one
    bold knockout 108 px at its widest, so the knockout takes 41 percent of the
    disc and the disc supplies all the mass.

    Each symbol is ONE path element. A fill rule applies to the subpaths of a
    single path, so splitting the disc and the knockout into two elements would
    paint ink over the disc instead of cutting the hole.
  -->

  <symbol id="h-browser-rose" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd">
    <!-- A compass rose knocked out: the world as a direction, not a picture. -->
    <path d="M1.800,12.000a10.200,10.200 0 1 0 20.400,0a10.200,10.200 0 1 0 -20.400,0 Z M12,3.800 Q13.320,10.680 20.200,12 Q13.320,13.320 12,20.200 Q10.680,13.320 3.800,12 Q10.680,10.680 12,3.800 Z" />
  </symbol>
