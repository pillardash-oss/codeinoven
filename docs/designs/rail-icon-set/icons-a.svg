<svg xmlns="http://www.w3.org/2000/svg" style="display: none">
  <!--
    DIRECTION A · "The Oven Wire" — outline tier
    Hairline mitered geometry on a 24 grid, 2px strokes, square caps and miter
    joins, right angles only. Curves appear only where a curve IS the object
    (a plug body). Every glyph is drawn to hold at 16px: no detail below ~2 units.
    The ember follows the ember variable, which lets the page show a gold-marked and a
    monochrome variant of the same drawing (custom properties inherit into a
    <use> shadow tree, CSS selectors do not, so the ember sets its own variable).
  -->
  <symbol id="a-projects" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <!-- The oven front, read as a folder: a wide frame, the chamber cut inside
         it, a slot on the right, and the ember lit in the chamber's middle.
         The chamber and the ember are drawn on a 4-unit rhythm so both keep a
         2-unit clearance and neither closes up at 16px. -->
    <path d="M2.5 5.5h19v14h-19z" />
    <rect x="5" y="8" width="10" height="8" />
    <path d="M18 11.5h3" />
    <rect x="8" y="10" width="4" height="4" fill="var(--icon-ember, var(--color-accent))" stroke="none" />
  </symbol>

  <symbol id="a-threads" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <!-- The ledger: one spine, three entries of unequal length. -->
    <path d="M6.5 5v14" />
    <path d="M6.5 7.5h13" />
    <path d="M6.5 12h9.5" />
    <path d="M6.5 16.5h5.5" />
  </symbol>

  <symbol id="a-scoped" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <!-- The scope: one field, one bounded region inside it. -->
    <path d="M3.5 3.5h17v17h-17z" />
    <path d="M9.5 9.5h5v5h-5z" />
  </symbol>

  <symbol id="a-board" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <!-- The board: one header rule, three columns of unequal drop. -->
    <path d="M3.5 4.5h17" />
    <path d="M6.5 8.5v8" />
    <path d="M12 8.5v10.5" />
    <path d="M17.5 8.5v5.5" />
  </symbol>

  <symbol id="a-chats" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <!-- The bubble: squared body, mitered tail, one line spoken. -->
    <path d="M3.5 4.5H20.5V16.5H10.5l-4 3.5V16.5H3.5z" />
    <path d="M7.5 10.5h8.5" />
  </symbol>

  <symbol id="a-assistant" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <!-- The sentinel: antenna, head, two square eyes. -->
    <path d="M12 4v3" />
    <path d="M5.5 7.5h13v8h-13z" />
    <rect x="7.6" y="10.2" width="2.6" height="2.6" />
    <rect x="13.8" y="10.2" width="2.6" height="2.6" />
  </symbol>

  <symbol id="a-browser" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <!-- The pane: window, title rule with its page control, one content column. -->
    <path d="M3.5 4.5h17v15h-17z" />
    <path d="M3.5 8.5h17" />
    <path d="M6 6.5h3" />
    <path d="M15.5 8.5v11" />
    <path d="M6.5 12h6" />
    <path d="M6.5 15h4" />
  </symbol>

  <symbol id="a-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <!-- The plate: a nameplate with its mark struck into it. -->
    <path d="M3.5 6.5h17v11h-17z" />
    <rect x="11.2" y="9.1" width="1.6" height="1.6" />
    <rect x="11.2" y="12.2" width="1.6" height="3.6" />
  </symbol>

  <symbol id="a-gauge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <!-- The gauge: instrument face, needle, pivot. -->
    <path d="M3.5 4.5h17v15h-17z" />
    <path d="M12 12l4.5-4.5" />
    <rect x="10.9" y="10.9" width="2.2" height="2.2" />
  </symbol>

  <symbol id="a-plug" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <!-- The plug: body and two pins. What you attach. -->
    <path d="M6.5 12.5h11v7h-11z" />
    <path d="M9.5 12.5V5.5" />
    <path d="M14.5 12.5V5.5" />
  </symbol>

  <symbol id="a-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <!-- The sliders: three rules, three handles, each at its own stop. -->
    <path d="M3.5 6.5h17" />
    <path d="M3.5 12h17" />
    <path d="M3.5 17.5h17" />
    <rect x="14.2" y="5.1" width="2.8" height="2.8" />
    <rect x="7.6" y="10.6" width="2.8" height="2.8" />
    <rect x="15.4" y="16.1" width="2.8" height="2.8" />
  </symbol>
</svg>
