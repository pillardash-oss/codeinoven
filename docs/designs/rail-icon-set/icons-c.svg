<svg xmlns="http://www.w3.org/2000/svg" style="display: none">
  <!--
    DIRECTION C - "The Weighted Line"
    The wire's drawing language at slab weight. Two stroke weights (3 primary,
    2.2 secondary) on the 24 grid, round caps and joins, rounded corners, and
    one or two solid anchors per glyph where the eye needs something to grab.
    No ember: one solid colour, exactly like the assistant mark.
    At 16px the 3-unit stroke lands on 2 whole pixels, which is what makes it
    read where the first outline pass did not.
  -->
  <symbol id="c-projects" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
    <!-- The oven front, read as a folder: a tab in the lid and a lit door.
         The tab is what keeps it apart from Scoped, which is a plain frame
         with the same kind of lit square inside it. -->
    <path d="M3.5 16 V8 A2.5 2.5 0 0 1 6 5.5 H9.4 L11.6 8.4 H18 A2.5 2.5 0 0 1 20.5 10.9 V16 A2.5 2.5 0 0 1 18 18.5 H6 A2.5 2.5 0 0 1 3.5 16 Z" />
    <rect x="6.5" y="11" width="7.5" height="5" rx="1.5" fill="currentColor" stroke="none" />
  </symbol>

  <symbol id="c-threads" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2">
    <!-- The thread: a spine with its entries, the live one solid. -->
    <path d="M5 6.5v11" stroke-width="3" />
    <rect x="8.6" y="5" width="11.4" height="3.2" rx="1.6" fill="currentColor" stroke="none" />
    <path d="M8.6 12h9.4" />
    <path d="M8.6 16.5h5.8" />
  </symbol>

  <symbol id="c-scoped" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
    <!-- The scope: a field, and the region selected inside it. -->
    <rect x="3.5" y="3.5" width="17" height="17" rx="2.5" />
    <rect x="8.5" y="8.5" width="7" height="7" rx="1.5" fill="currentColor" stroke="none" />
  </symbol>

  <symbol id="c-board" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
    <!-- The board: a header rule and three columns of unequal drop. -->
    <path d="M4.5 5h15" />
    <path d="M7.5 9.5v9" />
    <path d="M12 9.5v6.5" />
    <path d="M16.5 9.5v11" />
  </symbol>

  <symbol id="c-chats" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
    <!-- The bubble: a squared body with a mitered tail, and the line spoken. -->
    <path d="M3.5 8.5a2.5 2.5 0 0 1 2.5-2.5h12a2.5 2.5 0 0 1 2.5 2.5v6a2.5 2.5 0 0 1-2.5 2.5h-7l-3.6 3.6v-3.6h-.5a2.5 2.5 0 0 1-2.5-2.5z" />
    <rect x="7.5" y="9.5" width="9" height="2.8" rx="1.4" fill="currentColor" stroke="none" />
  </symbol>

  <symbol id="c-browser" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
    <!-- The page: a window, its title rule, one line of content. -->
    <rect x="3.5" y="5.5" width="17" height="13" rx="2.5" />
    <path d="M3.5 10.2h17" stroke-width="2.2" />
    <path d="M7 14.2h6" stroke-width="2.2" />
  </symbol>

  <symbol id="c-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
    <!-- The readout: a plate with its mark. -->
    <rect x="3.5" y="5.5" width="17" height="13" rx="2.5" />
    <circle cx="12" cy="9.2" r="1.2" fill="currentColor" stroke="none" />
    <path d="M12 12.4v3" stroke-width="2.6" />
  </symbol>

  <symbol id="c-gauge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
    <!-- The task rack: a machine holding three running slots of equal size.
         A gauge face with a needle was drawn first and dropped: inside a 13-unit
         ring the needle renders under one pixel wide, so at rail size it broke
         into disconnected specks. Three lanes hold their shape instead, and the
         lanes are deliberately equal so this cannot be confused with Thread,
         whose bars taper. -->
    <rect x="4" y="4" width="16" height="16" rx="2.5" />
    <path d="M4 9.3h16" stroke-width="2.6" />
    <path d="M4 14.6h16" stroke-width="2.6" />
  </symbol>

  <symbol id="c-plug" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
    <!-- The plug: what you attach, with its two pins. -->
    <rect x="6.5" y="11.5" width="11" height="8" rx="2" />
    <path d="M9.5 11.5V5.5" />
    <path d="M14.5 11.5V5.5" />
  </symbol>

  <symbol id="c-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6">
    <!-- The console: two sliders, each with a gap in its track that the handle
         sits in. The gap is what stops the handle merging into the rule at 16px,
         where a straddling knob would read as one thick bar. -->
    <path d="M3.5 8.5h7" />
    <path d="M18 8.5h2.5" />
    <rect x="11.65" y="6.3" width="5.2" height="4.4" rx="1.5" fill="currentColor" stroke="none" />
    <path d="M3.5 15.5h3.5" />
    <path d="M14.5 15.5h6" />
    <rect x="8.15" y="13.3" width="5.2" height="4.4" rx="1.5" fill="currentColor" stroke="none" />
  </symbol>
</svg>
