<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <symbol id="f-projects" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(-2.5263 -2.5263) scale(1.2105)" stroke-width="1.5696">
      <!-- Project: a folder, which is what a project is. -->
    <path d="M3.5 16.7V7.6a2 2 0 0 1 2-2h3.7l2.2 2.8h7.1a2 2 0 0 1 2 2v6.3a2 2 0 0 1-2 2H5.5a2 2 0 0 1-2-2Z" />
    <rect x="6.6" y="10.6" width="7" height="4.4" rx="1" fill="currentColor" stroke="none" />
    </g>
  </symbol>

  <symbol id="f-threads" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(-5.617 -5.617) scale(1.4681)" stroke-width="1.2942">
      <!-- Thread: a spine of entries that shorten as they age, the live one solid. -->
    <path d="M5.4 7.2v9.6" />
    <rect x="8.6" y="5.9" width="11.5" height="2.6" rx="1.3" fill="currentColor" stroke="none" />
    <path d="M8.6 12h9.4" />
    <path d="M8.6 16.4h6" />
    </g>
  </symbol>

  <symbol id="f-scoped" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(-2.5263 -2.5263) scale(1.2105)" stroke-width="1.5696">
      <!-- Scoped: a field with the selected region solid at its centre. -->
    <rect x="3.5" y="3.5" width="17" height="17" rx="2" />
    <rect x="9" y="9" width="6" height="6" rx="1.2" fill="currentColor" stroke="none" />
    </g>
  </symbol>

  <symbol id="f-board" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(-3.9231 -3.9231) scale(1.3269)" stroke-width="1.4319">
      <!-- Board: a header rule and three even columns. -->
    <path d="M4.4 5.8h15.2" />
    <rect x="5.2" y="9.4" width="3.2" height="9.2" rx="1" fill="currentColor" stroke="none" />
    <rect x="10.4" y="9.4" width="3.2" height="9.2" rx="1" fill="currentColor" stroke="none" />
    <rect x="15.6" y="9.4" width="3.2" height="9.2" rx="1" fill="currentColor" stroke="none" />
    </g>
  </symbol>

  <symbol id="f-chats" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(-2.5263 -2.5263) scale(1.2105)" stroke-width="1.5696">
      <!-- Chats: a squared bubble with a tapered tail and the line that was said. -->
    <path d="M3.5 8.6a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2v5.8a2 2 0 0 1-2 2h-7.3L7.4 20v-3.6H5.5a2 2 0 0 1-2-2Z" />
    <rect x="7.2" y="10.3" width="9.6" height="2.4" rx="1.2" fill="currentColor" stroke="none" />
    </g>
  </symbol>

  <symbol id="f-browser" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(-2.9639 -2.9639) scale(1.2470)" stroke-width="1.5237">
      <!-- Browser: the world, at the brand's own weight. A card was tried and
         rejected: at rail size a framed rectangle with a horizontal band in it
         is a bank card, not a browser. The globe is the one mark nobody has to
         be taught, and the meridian and equator are what keep it spherical. -->
    <circle cx="12" cy="12" r="8.3" />
    <path d="M3.7 12h16.6" />
    <ellipse cx="12" cy="12" rx="3.9" ry="8.3" />
    </g>
  </symbol>

  <symbol id="f-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(-2.5263 -2.5263) scale(1.2105)" stroke-width="1.5696">
      <!-- Settings: two sliders, each handle solid, its track entering from both
         sides. The gap in the track is what stops the handle merging into it at
         16px, which is exactly what happened in pass C. The gap is 1.6 units,
         which is just over one device pixel at rail size; a 1.2-unit gap
         vanished and the glyph became two plain bars. -->
    <path d="M3.5 8.6h2.9" />
    <path d="M15 8.6h5.5" />
    <rect x="8" y="6.9" width="5.4" height="3.4" rx="1.2" fill="currentColor" stroke="none" />
    <path d="M3.5 15.4h5.5" />
    <path d="M17.6 15.4h2.9" />
    <rect x="10.6" y="13.7" width="5.4" height="3.4" rx="1.2" fill="currentColor" stroke="none" />
    </g>
  </symbol>

  <symbol id="f-utilities" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(-2.5263 -2.5263) scale(1.2105)" stroke-width="1.5696">
      <!-- Utilities: the four panels the utilities page actually is, a grid of
         skills, MCP servers and plugins. -->
    <rect x="3.5" y="3.5" width="7.4" height="7.4" rx="1.6" />
    <rect x="13.1" y="3.5" width="7.4" height="7.4" rx="1.6" />
    <rect x="3.5" y="13.1" width="7.4" height="7.4" rx="1.6" />
    <rect x="13.1" y="13.1" width="7.4" height="7.4" rx="1.6" />
    </g>
  </symbol>

  <symbol id="f-tasks" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(-3.4286 -3.4286) scale(1.2857)" stroke-width="1.4778">
      <!-- Task manager: two running panels, one behind the other, the front one
         lit. Isometric planes and lanes were both tried first and both failed at
         16px: the planes closed into a single downward point, and the lanes read
         as a list, which is what Thread already is. The panels overlap by 2
         units so the offset is a visible step rather than two tiles touching. -->
    <rect x="7.8" y="3.8" width="12.7" height="7.8" rx="1.8" />
    <rect x="3.5" y="9.6" width="12.7" height="8.8" rx="1.8" fill="currentColor" stroke="none" />
    </g>
  </symbol>

  <symbol id="f-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(-2.5263 -2.5263) scale(1.2105)" stroke-width="1.5696">
      <!-- Update: a readout plate carrying its own mark. The dot and the stem are
         1.8 units wide, above the one-device-pixel floor, which pass D's
         version of this glyph was not. -->
    <rect x="3.5" y="4.8" width="17" height="14.4" rx="2" />
    <circle cx="12" cy="9.3" r="1.8" fill="currentColor" stroke="none" />
    <rect x="11.1" y="12.4" width="1.8" height="4.8" rx="0.9" fill="currentColor" stroke="none" />
    </g>
  </symbol>
</svg>
