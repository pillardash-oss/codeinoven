<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chief · the room, narrow · CodeInOven</title>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./room.css" />
  </head>
  <body>
    <div class="room" data-bare="true">
      <div class="room-main">
        <header class="room-head">
          <div class="room-id">
            <span class="mark" aria-hidden="true">
              <svg viewBox="0 0 96 96">
                <path d="M49 17a31 31 0 1 0 0 62" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="square" />
                <path d="M61 23h23v50H61z" fill="none" stroke="currentColor" stroke-width="7" />
                <rect x="58" y="45" width="29" height="6" fill="currentColor" />
                <circle cx="84" cy="48" r="5" fill="var(--color-accent)" />
              </svg>
            </span>
            <h1>Chief</h1>
          </div>
          <div class="head-tools">
            <div class="modes" role="group" aria-label="Assistant view">
              <button type="button" aria-pressed="true">Room</button>
              <button type="button" aria-pressed="false">Despatch</button>
            </div>
          </div>
        </header>

        <div class="house">
          <div class="greeting">
            <div class="eyebrow">Wed 4 Feb · 09:12</div>
            <h2>Two things need you.</h2>
            <p>Everyone else is working. Say what you want done.</p>
          </div>

          <div class="orbit">
            <div class="orbit-ring" data-ring="outer" aria-hidden="true"></div>
            <div class="orbit-ring" data-ring="inner" aria-hidden="true"></div>
            <div class="dial" data-dial data-now="138" aria-hidden="true"></div>
            <div class="now-hand" aria-hidden="true"></div>

            <div class="seat">
              <span class="mark" aria-hidden="true">
                <svg viewBox="0 0 96 96">
                  <path d="M49 17a31 31 0 1 0 0 62" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="square" />
                  <path d="M61 23h23v50H61z" fill="none" stroke="currentColor" stroke-width="7" />
                  <rect x="58" y="45" width="29" height="6" fill="currentColor" />
                  <circle cx="84" cy="48" r="5" fill="var(--color-accent)" />
                </svg>
              </span>
              <div class="seat-name">Chief</div>
            </div>

            <button class="node" type="button" data-state="working" style="left: 73.32%; top: 12.69%">
              <span class="node-disc" aria-hidden="true">NQ</span>
              <span class="node-name">Nightly QA</span>
            </button>
            <button class="node" type="button" data-state="error" style="left: 93.67%; top: 55.36%">
              <span class="node-disc" aria-hidden="true">DW</span>
              <span class="node-name">Dependency</span>
            </button>
            <button class="node" type="button" data-state="attention" style="left: 57.64%; top: 93.33%">
              <span class="node-disc" aria-hidden="true">RN</span>
              <span class="node-name">Release</span>
            </button>
            <button class="node" type="button" data-state="done" style="left: 17.3%; top: 79.44%">
              <span class="node-disc" aria-hidden="true">DD</span>
              <span class="node-name">Digest</span>
            </button>
            <button class="node" type="button" data-state="working" style="left: 9.2%; top: 33.52%">
              <span class="node-disc" aria-hidden="true">IR</span>
              <span class="node-name">Inbox</span>
            </button>
          </div>

          <div class="ledger">
            <div class="ledger-item">
              <div class="ledger-label"><span class="dot" style="background: var(--color-warning)"></span>Needs you</div>
              <div class="ledger-body">Dependency Watch lost its token <span class="dim">· 09:00</span></div>
            </div>
            <div class="ledger-item">
              <div class="ledger-label"><span class="dot" style="background: var(--color-thread-working)"></span>Working</div>
              <div class="ledger-body">Nightly QA · step 4 of 6</div>
            </div>
          </div>
        </div>

        <div class="lectern-wrap">
          <div class="lectern">
            <label class="sr-only" for="ask">Ask Chief</label>
            <textarea id="ask" rows="2" placeholder="Tell me what should happen"></textarea>
            <div class="lectern-foot">
              <button class="commission" type="button" title="Who takes this message" aria-label="Who takes this message: Chief decides">
                <span class="dot" aria-hidden="true"></span>
                Chief decides
              </button>
              <span class="foot-gap"></span>
              <button class="send" type="button">Send</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="./room.js"></script>
    <script src="./theme.js"></script>
  </body>
</html>
