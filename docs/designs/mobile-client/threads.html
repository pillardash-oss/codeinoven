<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CodeInOven Mobile, Threads</title>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="screen-page">
    <nav class="screen-nav" aria-label="Screens">
      <a href="./index.html">Cover</a>
      <span>/</span>
      <span class="now">Threads</span>
      <span class="spacer"></span>
      <a href="./conversation.html">Next, Conversation</a>
    </nav>

    <main class="screen">
      <h1 class="screen-label"><b>01</b> Inbox</h1>
      <p class="screen-note">
        Everything running on your machine, in one list. The gold rule marks the one row that
        needs you; nothing else competes with it.
      </p>

      <div class="phone">
        <div class="statusbar">
          <span>9:41</span>
          <span class="sb-right">
            <svg viewBox="0 0 16 12" fill="currentColor" aria-hidden="true"><rect x="0" y="8" width="2" height="4" /><rect x="4" y="5" width="2" height="7" /><rect x="8" y="2" width="2" height="10" /><rect x="12" y="0" width="2" height="12" opacity="0.4" /></svg>
            <svg viewBox="0 0 16 12" fill="currentColor" aria-hidden="true"><rect x="0" y="2" width="13" height="8" rx="1" opacity="0.35" /><rect x="1.5" y="3.5" width="8" height="5" /><rect x="14" y="4.5" width="2" height="3" /></svg>
          </span>
        </div>

        <header class="appbar">
          <svg class="brand-mark" viewBox="0 0 96 96" aria-hidden="true">
            <path d="M49 17a31 31 0 1 0 0 62" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter" />
            <path d="M61 23h23v50H61z" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="miter" />
            <rect x="58" y="45" width="29" height="6" fill="currentColor" />
            <circle cx="84" cy="48" r="5" fill="#d4af37" />
          </svg>
          <h2>Threads</h2>
          <button class="icon-btn" type="button" title="Search threads" aria-label="Search threads">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><circle cx="9" cy="9" r="5.5" /><path d="M13.2 13.2 17 17" /></svg>
          </button>
          <button class="icon-btn" type="button" title="Group threads by state" aria-label="Group threads by state" aria-pressed="false">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><path d="M3 5h14M3 10h9M3 15h5" /></svg>
          </button>
          <span class="spacer"></span>
          <button class="avatar" type="button" title="Your account" aria-label="Your account">OT</button>
        </header>

        <div class="scroller">
          <div class="list">
            <p class="section-label">Needs you <span class="count">2</span></p>

            <button class="row needs" type="button">
              <span class="mark" data-state="error" aria-hidden="true"></span>
              <span class="row-main">
                <span class="row-title">Terminal resize drift</span>
                <span class="row-meta">Approval waiting · shell command</span>
              </span>
              <span class="row-side">
                <span class="row-time">now</span>
                <span class="proj-chip"><b>codeinoven</b></span>
              </span>
            </button>

            <button class="row needs is-unread" type="button">
              <span class="mark" data-state="spec" aria-hidden="true"></span>
              <span class="row-main">
                <span class="row-title">Mobile companion spec</span>
                <span class="row-meta">Spec ready · 12 sections</span>
              </span>
              <span class="row-side">
                <span class="row-time">12m</span>
                <span class="proj-chip"><b>codeinoven</b></span>
              </span>
            </button>

            <p class="section-label">Working <span class="count">2</span></p>

            <button class="row" type="button">
              <span class="mark" data-state="working" aria-hidden="true"></span>
              <span class="row-main">
                <span class="row-title">Sidebar density pass</span>
                <span class="row-meta">Assignment · task 3 of 7 · 14m</span>
              </span>
              <span class="row-side">
                <span class="row-time">1h</span>
                <span class="proj-chip"><b>pillardash</b></span>
              </span>
            </button>

            <button class="row" type="button">
              <span class="mark" data-state="working" aria-hidden="true"></span>
              <span class="row-main">
                <span class="row-title">Thread row status marks</span>
                <span class="row-meta">Auto Pilot · spec approved · 6m</span>
              </span>
              <span class="row-side">
                <span class="row-time">2h</span>
                <span class="proj-chip"><b>codeinoven</b></span>
              </span>
            </button>

            <p class="section-label">Pinned</p>

            <button class="row" type="button">
              <span class="mark" data-state="pinned" aria-hidden="true"></span>
              <span class="row-main">
                <span class="row-title">Release 2.4 checklist</span>
                <span class="row-meta">Pinned · 4 unchecked items</span>
              </span>
              <span class="row-side">
                <span class="row-time">Tue</span>
              </span>
            </button>

            <p class="section-label">Recent</p>

            <button class="row is-unread" type="button">
              <span class="mark" data-state="unread" aria-hidden="true"></span>
              <span class="row-main">
                <span class="row-title">Fix SQLite lock on restart</span>
                <span class="row-meta">Done · 3 files changed · +41 / −12</span>
              </span>
              <span class="row-side">
                <span class="row-time">3h</span>
                <span class="proj-chip"><b>codeinoven</b></span>
              </span>
            </button>

            <button class="row" type="button">
              <span class="mark" data-state="done" aria-hidden="true"></span>
              <span class="row-main">
                <span class="row-title">Changelog wording</span>
                <span class="row-meta">Done · committed on mobile-app</span>
              </span>
              <span class="row-side">
                <span class="row-time">Mon</span>
              </span>
            </button>

            <button class="row" type="button">
              <span class="mark" data-state="todo" aria-hidden="true"></span>
              <span class="row-main">
                <span class="row-title">Keymap conflict audit</span>
                <span class="row-meta">Draft · nothing sent yet</span>
              </span>
              <span class="row-side">
                <span class="row-time">Sun</span>
              </span>
            </button>
          </div>
        </div>

        <div class="dock">
          <button class="tab" type="button" aria-current="true" title="Threads" aria-label="Threads">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" /><rect x="17" y="15.5" width="3" height="5" /></svg>
            <span>Threads</span>
          </button>
          <button class="tab" type="button" title="Projects" aria-label="Projects">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 6h6l2 3h10v11H3z" /></svg>
            <span>Projects</span>
          </button>
          <button class="tab" type="button" title="Chats" aria-label="Chats">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="miter" aria-hidden="true"><path d="M4 4h16v12H9l-5 4z" /></svg>
            <span>Chats</span>
          </button>
          <button class="tab" type="button" title="Assistant" aria-label="Assistant">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="miter" aria-hidden="true"><path d="M12 3l2 5.5L19.5 10 14 12l-2 5.5L10 12 4.5 10 10 8.5z" /></svg>
            <span>Assistant</span>
          </button>
        </div>
      </div>
    </main>
  </body>
</html>
