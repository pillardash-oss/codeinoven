<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CodeInOven Mobile, all screens</title>
  </head>
  <body>
    <main data-cio-canvas data-cio-columns="4">
      <section
        data-cio-frame="threads.html"
        data-cio-title="Inbox"
        data-cio-caption="Threads grouped by state"
        data-cio-width="430"
      ></section>
      <section
        data-cio-frame="conversation.html"
        data-cio-title="Conversation"
        data-cio-caption="Running turn and composer"
        data-cio-width="430"
      ></section>
      <section
        data-cio-frame="approvals.html"
        data-cio-title="Approvals"
        data-cio-caption="Permission, secret, question"
        data-cio-width="430"
      ></section>
      <section
        data-cio-frame="engineering.html"
        data-cio-title="Auto Pilot"
        data-cio-caption="Five stages, artifacts, diff"
        data-cio-width="430"
      ></section>
      <section
        data-cio-frame="usage.html"
        data-cio-title="Usage"
        data-cio-caption="Context, spend, quota, model"
        data-cio-width="430"
      ></section>
      <section
        data-cio-frame="compose.html"
        data-cio-title="New thread"

    <script src="/__cio/canvas.js"></script>
