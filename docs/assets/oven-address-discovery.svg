<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">How CodeInOven reaches an Oven that sits behind NAT</title>
  <desc id="desc">The oven machine knows only its private address. The cio-oven start command asks an echo service for the public address, ranks it first in the registration code, and the app dials the list in that order, connecting on the public address.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b6b74"/>
    </marker>
    <marker id="arrow-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f6feb"/>
    </marker>
  </defs>

  <rect width="1200" height="680" fill="#ffffff"/>

  <!-- heading -->
  <text x="48" y="58" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="650" fill="#1c1c1f">Reaching an Oven behind NAT</text>
  <text x="48" y="86" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="14" fill="#6b6b74">The machine cannot see the address you reach it on. The start command asks an echo service and lists that address first.</text>

  <!-- 1. machine -->
  <rect x="48" y="128" width="330" height="252" rx="10" fill="#f7f7f8" stroke="#d6d6db"/>
  <text x="72" y="160" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="650" letter-spacing="0.08em" fill="#6b6b74">OVEN MACHINE</text>
  <text x="72" y="188" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="600" fill="#1c1c1f">codeinoven-oven</text>
  <text x="72" y="208" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6b6b74">Ubuntu 24.04 · sshd on port 22</text>

  <text x="72" y="248" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#6b6b74">what it can see of itself</text>
  <rect x="72" y="258" width="282" height="30" rx="6" fill="#ffffff" stroke="#e3c9a1"/>
  <text x="86" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1c1c1f">172.16.0.4</text>
  <text x="206" y="278" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#b06f16">private, not routable here</text>

  <rect x="72" y="296" width="282" height="30" rx="6" fill="#ffffff" stroke="#e3c9a1"/>
  <text x="86" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1c1c1f">codeinoven-oven</text>
  <text x="230" y="316" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#b06f16">does not resolve elsewhere</text>

  <text x="72" y="356" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6b6b74">Its public address never appears on the machine.</text>

  <!-- 2. echo service -->
  <rect x="444" y="128" width="318" height="116" rx="10" fill="#f7f7f8" stroke="#d6d6db"/>
  <text x="468" y="158" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="650" letter-spacing="0.08em" fill="#6b6b74">ECHO SERVICE</text>
  <text x="468" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#1c1c1f">api.ipify.org</text>
  <text x="468" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#6b6b74">ifconfig.me/ip · icanhazip.com</text>
  <text x="468" y="228" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#6b6b74">1.5 s each, never blocks start</text>

  <!-- arrow machine -> echo -->
  <line x1="378" y1="176" x2="438" y2="176" stroke="#6b6b74" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- arrow echo -> list -->
  <line x1="603" y1="244" x2="603" y2="286" stroke="#2f6feb" stroke-width="1.5" marker-end="url(#arrow-strong)"/>
  <text x="616" y="270" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#2f6feb">answers 102.37.16.183</text>

  <!-- 3. ranked list -->
  <rect x="444" y="292" width="318" height="286" rx="10" fill="#ffffff" stroke="#d6d6db"/>
  <text x="468" y="322" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="650" letter-spacing="0.08em" fill="#6b6b74">ADDRESSES IN THE REGISTRATION CODE</text>

  <rect x="468" y="336" width="270" height="46" rx="6" fill="#eef4ff" stroke="#2f6feb"/>
  <text x="482" y="365" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#1c1c1f">1 · 102.37.16.183</text>
  <text x="600" y="365" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#2f6feb">public, dialed first</text>

  <rect x="468" y="392" width="270" height="42" rx="6" fill="#f7f7f8" stroke="#e0e0e5"/>
  <text x="482" y="418" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#6b6b74">2 · 172.16.0.4</text>

  <rect x="468" y="444" width="270" height="42" rx="6" fill="#f7f7f8" stroke="#e0e0e5"/>
  <text x="482" y="470" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#6b6b74">3 · codeinoven-oven</text>

  <text x="468" y="512" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6b6b74">Only globally routable answers are added,</text>
  <text x="468" y="530" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6b6b74">so a private address is never ranked first.</text>
  <text x="468" y="558" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6b6b74">Discovered once, at npx cio-oven start.</text>

  <!-- 4. this computer -->
  <rect x="822" y="128" width="330" height="450" rx="10" fill="#f7f7f8" stroke="#d6d6db"/>
  <text x="846" y="158" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="650" letter-spacing="0.08em" fill="#6b6b74">THIS COMPUTER</text>
  <text x="846" y="184" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#6b6b74">dials the list in order, keeps the first</text>
  <text x="846" y="202" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#6b6b74">one that answers</text>

  <rect x="846" y="222" width="282" height="72" rx="8" fill="#e9f7ee" stroke="#2da44e"/>
  <text x="862" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#1c1c1f">102.37.16.183:22</text>
  <text x="862" y="274" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#1a7f37">connects · key accepted · shell ready</text>

  <line x1="864" y1="312" x2="864" y2="336" stroke="#6b6b74" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="878" y="330" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6b6b74">only if that one times out</text>

  <rect x="846" y="344" width="282" height="52" rx="8" fill="#ffffff" stroke="#e0e0e5" stroke-dasharray="4 4"/>
  <text x="862" y="368" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#6b6b74">172.16.0.4</text>
  <text x="862" y="386" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#6b6b74">unreachable across NAT</text>

  <rect x="846" y="406" width="282" height="52" rx="8" fill="#ffffff" stroke="#e0e0e5" stroke-dasharray="4 4"/>
  <text x="862" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#6b6b74">codeinoven-oven</text>
  <text x="862" y="448" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#6b6b74">last, because it fails most often</text>

  <rect x="846" y="480" width="282" height="72" rx="8" fill="#fff8e6" stroke="#e3c9a1"/>
  <text x="862" y="506" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" fill="#8a5a10">No routable answer found?</text>
  <text x="862" y="526" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#8a5a10">Type the public address in the dialog.</text>
  <text x="862" y="544" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#8a5a10">That is the only field left.</text>

  <!-- arrow list -> computer -->
  <line x1="768" y1="360" x2="812" y2="360" stroke="#2f6feb" stroke-width="1.5" marker-end="url(#arrow-strong)"/>

  <!-- footer -->
  <line x1="48" y1="612" x2="1152" y2="612" stroke="#e0e0e5"/>
  <text x="48" y="642" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#6b6b74">npx @pdslng/cio-oven start</text>
  <text x="336" y="642" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#6b6b74">publishes the public address first, then the machine's own view of itself</text>
</svg>
