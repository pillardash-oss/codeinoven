appId: com.pillardash.codeinoven
productName: CodeInOven
directories:
  buildResources: build
  output: dist
publish:
  provider: github
  owner: pillardash-oss
  repo: codeinoven
  releaseType: release
afterPack: scripts/native-splash/after-pack.js
extraResources:
  - from: resources/speech/model-catalog.json
    to: speech/model-catalog.json
  # Invisible Electron utilityProcess bridge that runs bundled harness modules
  # in-process (macOS never shows a separate Dock app for them).
  - from: resources/harnesses/utility-bridge.cjs
    to: harnesses/utility-bridge.cjs
  # The bundled Pi harness (see scripts/build-pi-harness.ts) is pure JS with
  # no native addons, so one copy covers every platform/arch.
  - from: resources/harnesses/pi
    to: harnesses/pi
asarUnpack:
  - node_modules/ffmpeg-static/ffmpeg*
files:
  - out/**/*
  - '!out/**/.DS_Store'
  - '!node_modules/better-sqlite3/deps/**'
  - '!node_modules/better-sqlite3/src/**'
  - '!node_modules/better-sqlite3/binding.gyp'
# Signing is driven by CI environment variables (CSC_LINK, CSC_KEY_PASSWORD,
# APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID). When unset, builds
# produce unsigned artifacts. Local macOS package scripts opt into ad-hoc
# signing after fuses are applied so integrity-protected builds remain runnable.
forceCodeSigning: false
# The native Stage 0 hook applies these same security fuses directly to the
# renamed Electron child before electron-builder signs it. Declaring them here
# would make electron-builder target the public native launcher instead.
mac:
  extraResources:
    # The top-level extraResources list already ships model-catalog.json and
    # harnesses/pi; electron-builder merges top-level and platform lists, so
    # repeating them here copies the same tree twice. Duplicating any symlink
    # inside those trees (e.g. a vendored .bin/esbuild) crashes the second copy
    # pass with EEXIST. Only the darwin-arm64 speech runtime is mac-specific.
    - from: resources/speech/runtime/darwin-arm64
      to: speech
  hardenedRuntime: true
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Allow browser pages you approve to use the camera for local app testing.
    NSMicrophoneUsageDescription: Record audio for local dictation and transcription in CodeInOven.
    # "Open in CodeInOven" from Finder. Declaring folders and generic document
    # data is what makes CodeInOven appear in the Finder context menu's
    # "Open With" list (and lets a folder be dropped on the Dock icon).
    # `LSHandlerRank: Alternate` deliberately keeps CodeInOven out of the
    # default-handler role: it is available on demand, never the app that opens
    # every folder or file on double click.
    CFBundleDocumentTypes:
      - CFBundleTypeName: Folder
        CFBundleTypeRole: Editor
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - public.folder
      - CFBundleTypeName: CodeInOven Document
        CFBundleTypeRole: Editor
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - public.data
          - public.text
          - public.source-code
          - public.content
  icon: src/renderer/static/macos/AppIcon.icns
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  artifactName: ${name}-${version}-${arch}.${ext}
  # The native-splash launcher is the main executable (bundle id
  # `com.pillardash.codeinoven`); it `execv`s into the renamed Electron binary
  # `CodeInOven-electron`. Squirrel.Mac validates every update against the
  # RUNNING process's designated requirement (`identifier "CodeInOven-electron"`),
  # so the top-level bundle sign must carry that same identifier or every update
  # fails with "code failed to satisfy specified code requirement(s)".
  # `mac-sign.js` wraps the default signer and overrides the identifier for the
  # bundle sign only (helpers/frameworks keep their own identifiers).
  sign: scripts/native-splash/mac-sign.js
  # Platform-level `files` replaces the top-level list, so the base set is
  # repeated here. better-sqlite3 ships prebuilds for every platform; this app
  # targets Apple Silicon only, so only the darwin-arm64 binary is kept.
  files:
    - out/**/*
    - '!out/**/.DS_Store'
    - '!node_modules/better-sqlite3/deps/**'
    - '!node_modules/better-sqlite3/src/**'
    - '!node_modules/better-sqlite3/binding.gyp'
    - '!node_modules/better-sqlite3/prebuilds/darwin-x64.node'
    - '!node_modules/better-sqlite3/prebuilds/linux*'
    - '!node_modules/better-sqlite3/prebuilds/win32*'
win:
  icon: build/icon.ico
  target:
    - nsis
  artifactName: ${name}-${version}-setup.${ext}
# Windows keeps shell integration in the registry, so "Open in CodeInOven" is
# added to the Explorer context menu for folders, folder backgrounds, and files
# by the installer (and removed by the uninstaller)   build/installer.nsh.
nsis:
  include: build/installer.nsh
# Microsoft Store packaging. Built on demand with `bun run package:msix`; the
# `win.target` above stays NSIS so ordinary builds and the winget feed are
# unchanged, and the MSIX is the Store channel only.
#
# electron-builder's `appx` target produces an MSIX. Partner Center re-signs the
# package with a Microsoft certificate, which is the whole point: it gives
# Windows a publisher identity without us buying a Windows code-signing
# certificate.
#
# `identityName` and `publisher` are deliberately absent. Partner Center assigns
# both (Product management > Product identity > Package/Identity/*), the values
# are case- and punctuation-sensitive, and a wrong value fails certification
# long after the build. `scripts/msix.ts` is therefore the only supported entry
# point and refuses to build without them. That guard is not cosmetic:
# electron-builder silently substitutes `CN=ms` for a missing publisher on an
# unsigned appx build (app-builder-lib/out/codeSign/windowsSignToolManager.js,
# `computePublisherName`), and falls back to the package.json `name` for a
# missing identity name.
appx:
  # Partner Center assigns both of these: Product management > Product identity >
  # "Package/Identity/Name" and "Package/Identity/Publisher". Paste them here
  # byte for byte, including case and punctuation. They are left deliberately
  # unset-looking so `bun run msix:check` fails with the value to paste instead of
  # producing a package with an invented identity; see scripts/msix.ts.
  identityName: REPLACE_WITH_PARTNER_CENTER_IDENTITY_NAME
  publisher: REPLACE_WITH_PARTNER_CENTER_PUBLISHER
  applicationId: CodeInOven
  displayName: CodeInOven
  publisherDisplayName: Pillardash Solutions Limited
  # There is no i18n layer in this app, so en-US is the only honest answer, and
  # it has to agree with the languages selected on the Store listing.
  languages:
    - en-US
  # Windows 10 1809. The manifest electron-builder generates uses
  # EntryPoint="Windows.FullTrustApplication", which is the correct full-trust
  # form below 10.0.19041.0, so the floor stays under that.
  minVersion: 10.0.17763.0
  maxVersionTested: 10.0.26100.0
  # `runFullTrust` is mandatory for a full-trust desktop app and electron-builder
  # adds it automatically; declared here so the package's trust story is
  # readable rather than implied. It is a restricted capability, so the Store
  # submission asks for a justification.
  capabilities:
    - runFullTrust
  backgroundColor: '#0c0c10'
  # Store tile and taskbar logos are rendered from the master SVG into
  # `build/appx` by scripts/build-app-icons.ts, which is where the appx target
  # looks for its user assets.
  artifactName: codeinoven-${version}-${arch}.msix
linux:
  icon: src/renderer/static/icon.png
  target:
    - AppImage
    - deb
  category: Development
  artifactName: ${name}-${version}.${ext}
  # `%F` passes every selected path as its own argument, so "Open in CodeInOven"
  # with a folder (or a multi-selection) is one launch with several paths, which
  # main classifies exactly like the macOS Finder hand-off.
  executableArgs:
    - '%F'
  # `inode/directory` puts CodeInOven in the folder "Open With" list; the text
  # and code types cover opening a single file on its own.
  mimeTypes:
    - inode/directory
    - text/plain
    - text/markdown
    - text/html
    - text/css
    - text/x-python
    - text/x-csrc
    - application/json
    - application/xml
    - application/javascript
    - application/pdf
    - image/png
    - image/jpeg
