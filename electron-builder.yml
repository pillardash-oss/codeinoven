appId: com.pillardash.codeinoven
productName: CodeInOven
directories:
  buildResources: build
  output: dist
publish:
  provider: github
  owner: pillardash-oss
  repo: codeinoven
  releaseType: release
files:
  - out/**/*
  - '!out/**/.DS_Store'
  - '!node_modules/better-sqlite3/deps/**'
  - '!node_modules/better-sqlite3/src/**'
  - '!node_modules/better-sqlite3/binding.gyp'
# Signing is driven by CI environment variables (CSC_LINK, CSC_KEY_PASSWORD,
# APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID). When unset, builds
# produce unsigned artifacts. Local macOS package scripts opt into ad-hoc
# signing after fuses are applied so integrity-protected builds remain runnable.
forceCodeSigning: false
electronFuses:
  # CodeInOven intentionally keeps RunAsNode enabled because the packaged
  # Electron binary hosts the stdio utility gateway. The remaining production
  # escape hatches are disabled and app.asar is integrity-bound before signing.
  runAsNode: true
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  # Electron 43 packages do not ship browser_v8_context_snapshot.bin; enabling
  # this fuse makes the signed app abort before main-process startup.
  loadBrowserProcessSpecificV8Snapshot: false
  # The desktop renderer still loads from file://; remove this compatibility
  # fuse only after migrating the main document to a custom app protocol.
  grantFileProtocolExtraPrivileges: true
mac:
  hardenedRuntime: true
  notarize: true
  icon: src/renderer/static/macos/AppIcon.icns
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  artifactName: ${name}-${version}-${arch}.${ext}
win:
  icon: src/renderer/static/icon.png
  target:
    - nsis
  artifactName: ${name}-${version}-setup.${ext}
linux:
  icon: src/renderer/static/icon.png
  target:
    - AppImage
    - deb
  category: Development
  artifactName: ${name}-${version}.${ext}
