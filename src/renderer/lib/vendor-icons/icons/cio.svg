<svg width="1em" height="1em" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><title>CodeInOven</title>
  <defs>
    <!-- Tile body: near-black charcoal, subtly lighter at the top. -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b31"/>
      <stop offset="0.55" stop-color="#17171c"/>
      <stop offset="1" stop-color="#0c0c10"/>
    </linearGradient>
    <!-- Top gloss: a soft light falloff hugging the top edge of the tile. -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.28" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Ember glow behind the smoke: warm halo bleeding off the tile top. -->
    <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#ff6a00" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
    <!-- Faint warm reflection cast by the oven door light strip. -->
    <radialGradient id="reflection" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8a2a" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/>
    </radialGradient>
    <!-- Smoke: heated amber rising to bright flame. -->
    <linearGradient id="smoke-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff6f00"/>
    </linearGradient>
    <!-- Clips every painted layer to the squircle tile. -->
    <clipPath id="tile-clip">
      <rect x="112" y="112" width="800" height="800" rx="184" ry="184"/>
    </clipPath>
    <!-- Hairline light stroke along the tile's top edge for tactile depth. -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Squircle tile -->
  <rect x="112" y="112" width="800" height="800" rx="184" ry="184" fill="url(#tile)"/>

  <g clip-path="url(#tile-clip)">
    <!-- Ember halo behind the rising smoke -->
    <ellipse cx="512" cy="250" rx="330" ry="230" fill="url(#ember)"/>
    <!-- Warm floor reflection under the oven -->
    <ellipse cx="512" cy="840" rx="330" ry="170" fill="url(#reflection)"/>
    <!-- Top gloss -->
    <rect x="112" y="112" width="800" height="440" fill="url(#gloss)"/>
  </g>

