<!doctype html>
<html lang="en" data-browser-overlay>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws:"
    />
    <title>Overlay</title>
    <style>
      /* The window is transparent and only the regions that draw paint. The app
         stylesheet gives a document the app's surface colour, which here would
         be a rectangle of app background sitting on top of the page underneath. */
      html,
      body {
        background: transparent !important;
      }

      body {
        overflow: hidden;
      }

      /* Vite sends compile errors to every renderer, including this transparent
         native host. Its copy floats above the main window but cannot reliably
         receive clicks or Escape because this host passes input through. Keep
         the dismissible error card in the main window only. This rule must live
         in the document so it also applies when a module or app.css fails to load. */
      vite-error-overlay {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="browser-overlay"></div>
    <script type="module" src="./browser-overlay.ts"></script>
  </body>
</html>
