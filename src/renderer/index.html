<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file: appfile:; media-src 'self' blob: appfile: http://127.0.0.1:*; font-src 'self' data:; frame-src 'self' appfile: blob:; connect-src 'self' data: ws:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="icon" type="image/png" sizes="300x300" href="./favicon.png" />
    <script src="./theme-init.js"></script>
    <title>CodeInOven</title>
    <!--
      The first frame, before any JavaScript runs.

      The window can be revealed before this document's module graph has
      evaluated (a slow launch hits the splash budget first), and an empty
      `#app` is a black surface with a rail in it: the ugliest state this app
      can show, and the one the user called out. This skeleton stands in for the
      shell and the conversation from the first byte, using the app's own
      palette and the conversation skeleton's own vocabulary (prompt, folded
      trace, answer), so the reveal lands on a skeleton and the skeleton becomes
      the conversation. `main.ts` removes it once the app has painted over it.

      It is inline and script-free on purpose: a module would run too late to
      matter, and this must paint even if the bundle never loads.
    -->
    <style>
      :root {
        --boot-app: #f7f6f2;
        --boot-surface: #ffffff;
        --boot-overlay: #e8e7e2;
        --boot-border: #e2e1dc;
      }
      .dark {
        --boot-app: #0b0b0d;
        --boot-surface: #141417;
        --boot-overlay: #242429;
        --boot-border: #27272c;
      }
      html,
      body {
        margin: 0;
        background: var(--boot-app);
      }
      #boot-skeleton {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        height: 100vh;
        flex-direction: column;
        overflow: hidden;
        background: var(--boot-app);
        font-family: system-ui, sans-serif;
      }
      #boot-skeleton .boot-header {
        height: 2.25rem;
        flex-shrink: 0;
        border-bottom: 1px solid var(--boot-border);
        background: var(--boot-surface);
      }
      #boot-skeleton .boot-body {
        display: flex;
        min-height: 0;
        flex: 1;
      }
      #boot-skeleton .boot-rail {
        width: 2.5rem;
        flex-shrink: 0;
        background: var(--boot-surface);
      }
      #boot-skeleton .boot-sidebar {
        width: 22.5rem;
        flex-shrink: 0;
        padding: 1rem 0.875rem;
        border-right: 1px solid var(--boot-border);
        background: var(--boot-app);
      }
      #boot-skeleton .boot-conversation {
        display: flex;
        min-width: 0;
        flex: 1;
        flex-direction: column;
        justify-content: flex-end;
        padding: 1.5rem 1.5rem 0;
      }
      #boot-skeleton .boot-stack {
        width: 100%;
        max-width: 48rem;
        margin: 0 auto;
        padding-bottom: 1.25rem;
      }
      #boot-skeleton .boot-composer {
        height: 4.5rem;
        margin: 0 auto 2.5rem;
        max-width: 48rem;
        border: 1px solid var(--boot-border);
        background: var(--boot-surface);
      }
      #boot-skeleton .boot-bar {
        height: 0.75rem;
        margin-bottom: 0.625rem;
        background: var(--boot-overlay);
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      #boot-skeleton .boot-bar.dim {
        opacity: 0.6;
      }
      #boot-skeleton .boot-row {
        margin-bottom: 0.875rem;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.45;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-skeleton .boot-bar {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot-skeleton" aria-hidden="true">
        <div class="boot-header"></div>
        <div class="boot-body">
          <div class="boot-rail"></div>
          <div class="boot-sidebar">
            <div class="boot-row"><div class="boot-bar" style="width: 52%"></div></div>
            <div class="boot-row"><div class="boot-bar dim" style="width: 78%"></div></div>
            <div class="boot-row"><div class="boot-bar dim" style="width: 64%"></div></div>
            <div class="boot-row"><div class="boot-bar dim" style="width: 71%"></div></div>
            <div class="boot-row"><div class="boot-bar dim" style="width: 45%"></div></div>
            <div class="boot-row"><div class="boot-bar dim" style="width: 68%"></div></div>
          </div>
          <div class="boot-conversation">
            <div class="boot-stack">
              <div class="boot-row"><div class="boot-bar" style="width: 58%"></div></div>
              <div class="boot-row"><div class="boot-bar dim" style="width: 34%"></div></div>
              <div class="boot-row"><div class="boot-bar dim" style="width: 16%"></div></div>
              <div class="boot-row"><div class="boot-bar" style="width: 93%"></div></div>
              <div class="boot-row"><div class="boot-bar dim" style="width: 88%"></div></div>
              <div class="boot-row"><div class="boot-bar dim" style="width: 96%"></div></div>
              <div class="boot-row"><div class="boot-bar dim" style="width: 64%"></div></div>
            </div>
            <div class="boot-composer"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
