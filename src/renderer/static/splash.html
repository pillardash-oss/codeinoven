<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <title>CodeInOven</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000000;
        color: #f7f6f2;
        font-family:
          'JetBrainsMono Nerd Font Mono', ui-monospace, 'SFMono-Regular', Menlo, Monaco,
          'Cascadia Code', monospace;
        overflow: hidden;
        user-select: none;
        cursor: default;
      }

      .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .logo {
        width: 220px;
        height: 209px;
        flex: 0 0 auto;
        overflow: visible;
      }

      .logo-mark {
        transform-box: fill-box;
        transform-origin: center;
        animation: logoSettle 2.2s ease-in-out infinite;
      }

      @keyframes logoSettle {
        0%,
        100% {
          transform: scale(0.96);
        }
        28% {
          transform: scale(1.035);
        }
        46% {
          transform: scale(0.99);
        }
        62% {
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .logo-mark {
          animation: none;
        }
      }

      .splash-meta {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        margin-top: 10px;
      }

      .version {
        color: #f7f6f2;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.08em;
      }
    </style>
  </head>

  <body>
    <div class="splash">
      <svg
        class="logo"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="10 10 80 76"
        role="img"
        aria-label="CodeInOven C/O logo"
      >
        <g
          class="logo-mark"
          fill="none"
          stroke="#f5f4f0"
          stroke-linecap="square"
          stroke-linejoin="miter"
        >
          <path d="M49 17a31 31 0 1 0 0 62" stroke-width="8" />
          <path d="M61 23h23v50H61z" stroke-width="7" />
          <rect x="58" y="45" width="29" height="6" fill="#f5f4f0" />
          <circle cx="84" cy="48" r="5" fill="#d4af37" stroke="none" />
        </g>
      </svg>
      <div class="splash-meta" aria-label="Application version">
        <span class="version"><span id="splash-version">v—</span> - By</span>
        <span class="version">Pillardash Solutions Limited</span>
      </div>
    </div>
    <script>
      const version = new URLSearchParams(window.location.search).get('version')
      if (version) {
        // `version` already carries the full prerelease semver on nightly builds
        // (e.g. 0.5.53-nightly.4), since CI resolves that tag before packaging
        // and bakes it into the bundle via __CODEINOVEN_APP_VERSION__.
        document.getElementById('splash-version').textContent = `v${version.replace(/^v/i, '')}`
      }
    </script>
  </body>
</html>
