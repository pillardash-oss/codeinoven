<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <title>CodeInOven</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000000;
        color: #f7f6f2;
        font-family:
          'JetBrainsMono Nerd Font Mono', ui-monospace, 'SFMono-Regular', Menlo, Monaco,
          'Cascadia Code', monospace;
        overflow: hidden;
        user-select: none;
        cursor: default;
      }

      .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .logo {
        width: 220px;
        height: 209px;
        flex: 0 0 auto;
        overflow: visible;
      }

      /*
       * The mark draws itself: the C sweeps counter-clockwise, the O closes as a
       * square, the slot snaps in and the auric dot ignites last.
       *
       * `pathLength="1"` normalises each path to one unit, so a dash of one unit
       * covers it exactly and the draw-in needs no measured path length.
       *
       * The resolved state is the base style, not the animation's end state. A
       * launch with animations disabled, and a reduced-motion preference, then
       * still show the complete mark rather than a blank space.
       */
      .draw-stroke {
        stroke-dasharray: 1;
        stroke-dashoffset: 0;
      }

      .draw-dot {
        transform-box: fill-box;
        transform-origin: center;
      }

      /*
       * The sheen: a band of auric light stencilled to the mark, falling down the
       * logo and rising back up on a loop. Drawn, not stored. Parked clear above
       * the mark is the base style, so animations off and reduced motion show the
       * resolved mark unlit rather than a band stuck across it.
       */
      .sheen-band {
        transform-box: fill-box;
        transform-origin: center;
        transform: translateY(-52px) rotate(14deg);
      }

      @media (prefers-reduced-motion: no-preference) {
        .draw-c,
        .draw-o,
        .draw-slot,
        .draw-dot {
          /*
           * One play, then held. The splash is torn down when the main window
           * paints, so it must resolve well inside that window and then sit
           * still instead of looping under the user's eye.
           *
           * The timings below resolve the mark by about 1.2s and then hold to
           * the end of the 1.6s. Startup telemetry puts the main window's first
           * frame at roughly 3.7s from process entry on this machine, so the
           * mark is normally complete and still for a beat or two before the
           * window covers it. Resolving earlier also keeps the signature auric
           * dot on screen on faster launches, which a longer sequence would miss.
           *
           * The easing is a gentle deceleration rather than a hard ease-out.
           * Applied per keyframe segment, a hard curve drew the whole C inside
           * the first 285ms, which reads as a snap instead of a stroke.
           */
          animation-duration: 1.6s;
          animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94);
          animation-fill-mode: both;
        }

        .draw-c {
          animation-name: splashDrawC;
        }

        .draw-o {
          animation-name: splashDrawO;
        }

        .draw-slot {
          animation-name: splashDrawSlot;
        }

        .draw-dot {
          animation-name: splashDrawDot;
        }

        .sheen-band {
          /*
           * One pass down and back up, repeating until the window paints over the
           * splash. `alternate` is the whole ping-pong. It starts as the draw
           * resolves, and the band is clear of the mark at both ends of the
           * travel, so the turn happens while the mark is unlit.
           */
          animation-name: splashSheenFall;
          animation-duration: 1.15s;
          animation-timing-function: cubic-bezier(0.33, 0, 0.67, 1);
          animation-delay: 1.15s;
          animation-iteration-count: infinite;
          animation-direction: alternate;
          animation-fill-mode: both;
        }
      }

      @keyframes splashDrawC {
        0% {
          stroke-dashoffset: 1;
        }
        28%,
        100% {
          stroke-dashoffset: 0;
        }
      }

      @keyframes splashDrawO {
        0%,
        9% {
          stroke-dashoffset: 1;
        }
        50%,
        100% {
          stroke-dashoffset: 0;
        }
      }

      @keyframes splashDrawSlot {
        0%,
        47% {
          opacity: 0;
        }
        59%,
        100% {
          opacity: 1;
        }
      }

      @keyframes splashDrawDot {
        0%,
        56% {
          transform: scale(0);
        }
        75%,
        100% {
          transform: scale(1);
        }
      }

      @keyframes splashSheenFall {
        0% {
          transform: translateY(-52px) rotate(14deg);
        }
        100% {
          transform: translateY(116px) rotate(14deg);
        }
      }

      .splash-meta {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        margin-top: 10px;
      }

      .version {
        color: #f7f6f2;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.08em;
      }
    </style>
  </head>

  <body>
    <div class="splash">
      <svg
        class="logo"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="10 10 80 76"
        role="img"
        aria-label="CodeInOven C/O logo"
      >
        <defs>
          <!-- A vertical fade, so the band has soft edges instead of hard ones. -->
          <linearGradient id="splashSheenWarm" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#d4af37" stop-opacity="0" />
            <stop offset="0.5" stop-color="#d4af37" stop-opacity="0.5" />
            <stop offset="1" stop-color="#d4af37" stop-opacity="0" />
          </linearGradient>
          <!-- The stencil: the mark's own geometry, so the light can only land on
               the mark and never beside it. -->
          <mask
            id="splashSheenStencil"
            maskUnits="userSpaceOnUse"
            x="10"
            y="10"
            width="80"
            height="76"
          >
            <rect x="10" y="10" width="80" height="76" fill="#000000" />
            <g fill="#ffffff" stroke="#ffffff" stroke-linecap="square" stroke-linejoin="miter">
              <path d="M49 17a31 31 0 1 0 0 62" fill="none" stroke-width="8" />
              <path d="M61 23h23v50H61z" fill="none" stroke-width="7" />
              <rect x="58" y="45" width="29" height="6" />
              <!-- stroke="none" as on the mark, or the stencil's dot is half a
                   unit fatter and lights a ring of light around it. -->
              <circle cx="84" cy="48" r="5" stroke="none" />
            </g>
          </mask>
        </defs>
        <g fill="none" stroke="#f5f4f0" stroke-linecap="square" stroke-linejoin="miter">
          <path
            class="draw-stroke draw-c"
            d="M49 17a31 31 0 1 0 0 62"
            stroke-width="8"
            pathLength="1"
          />
          <path class="draw-stroke draw-o" d="M61 23h23v50H61z" stroke-width="7" pathLength="1" />
          <rect class="draw-slot" x="58" y="45" width="29" height="6" fill="#f5f4f0" />
          <circle class="draw-dot" cx="84" cy="48" r="5" fill="#d4af37" stroke="none" />
        </g>
        <!-- The sheen, stencilled to the mark. The stencil sits on this group and
             the tilt on the band inside it, because a mask referenced by a tilted
             element is resolved in that tilted space and would tilt with it. -->
        <g class="sheen" mask="url(#splashSheenStencil)">
          <rect
            class="sheen-band"
            x="8"
            y="0"
            width="88"
            height="34"
            fill="url(#splashSheenWarm)"
          />
        </g>
      </svg>
      <div class="splash-meta" aria-label="Application version">
        <span class="version"><span id="splash-version">v—</span> - By</span>
        <span class="version">Pillardash Solutions Limited</span>
      </div>
    </div>
    <script>
      const version = new URLSearchParams(window.location.search).get('version')
      if (version) {
        // `version` already carries the full prerelease semver on nightly builds
        // (e.g. 0.5.53-nightly.4), since CI resolves that tag before packaging
        // and bakes it into the bundle via __CODEINOVEN_APP_VERSION__.
        document.getElementById('splash-version').textContent = `v${version.replace(/^v/i, '')}`
      }
    </script>
  </body>
</html>
