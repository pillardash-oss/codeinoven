<?xml version="1.0" encoding="UTF-8"?>
<!--
  CodeInOven vendor mark — the bare transparent oven+code artwork.
  Used everywhere CodeInOven appears as a vendor (model picker, custom
  providers, about-screen links) via src/renderer/lib/vendor-icons.
  Ink strokes are pure #000000 on light surfaces and pure #ffffff on dark
  surfaces (flat and sharp at small scale). The flame wisps and oven
  handle keep the fixed brand orange. The platform app icon (squircle
  tile) lives in icon.svg; this mark is deliberately tile-free.
-->
<svg viewBox="0 0 1254 1254" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Flat, sharp ink for small-scale vendor rendering: pure black on light
       surfaces, pure white on dark. The app toggles the `dark` class on the
       root document element and vendor SVGs are inlined into the DOM, so this
       selector applies. */
    #cio-mark .ink { fill: #000000; }
    .dark #cio-mark .ink { fill: #ffffff; }
  </style>
