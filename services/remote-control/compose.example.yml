services:
  remote-control:
    build:
      context: .
      dockerfile: services/remote-control/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BETTER_AUTH_URL: https://${REMOTE_PUBLIC_HOST:?set REMOTE_PUBLIC_HOST}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?set GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:?set GOOGLE_OAUTH_CLIENT_SECRET}
      APPLE_OAUTH_CLIENT_ID: ${APPLE_OAUTH_CLIENT_ID:?set APPLE_OAUTH_CLIENT_ID}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:?set APPLE_TEAM_ID}
      APPLE_KEY_ID: ${APPLE_KEY_ID:?set APPLE_KEY_ID}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:?set APPLE_PRIVATE_KEY}
      REMOTE_ALLOWED_ORIGINS: https://${REMOTE_PUBLIC_HOST:?set REMOTE_PUBLIC_HOST}
      REMOTE_TRUST_PROXY: 'true'
    expose:
      - '8877'
    volumes:
      - remote-data:/data
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "const response = await fetch('http://127.0.0.1:8877/healthz'); if (!response.ok) process.exit(1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  mobile-pwa:
    build:
      context: .
      dockerfile: services/remote-control/Dockerfile.pwa
    restart: unless-stopped
    depends_on:
      remote-control:
        condition: service_healthy
    expose:
      - '80'
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://127.0.0.1/remote.html']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  remote-data:
