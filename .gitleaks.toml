# Shared gitleaks configuration: the pinned gitleaks binary in the Security
# workflow auto-discovers this file at the repo root, and the local CI mirror
# (`bun run ci:local`) runs the same scan. `gitleaks detect` walks the whole git
# history, so an allowlist entry has to keep covering files that were deleted
# long after the commit that introduced their fixtures.
title = 'CodeInOven gitleaks config'

[extend]
useDefault = true

[[allowlists]]
description = 'Fake credentials in test fixtures, plus the published installed-app OAuth client secret'
paths = [
  '''^tests/main/utilities/cio-diagnostics-service\.test\.ts$'''
]
# Exact-value entries for known-safe credential-shaped strings. Both are public
# constants rather than secrets, and neither is allowlisted by file, so any
# other credential reaching any file is still reported:
#
# - `dGhlIHNhbXBsZSBub25jZQ==` is the RFC 6455 handshake example key (the base64
#   sample nonce) used as a fixture in the remote gateway tests. That test file
#   was deleted by the "pull remote access out of the app" refactor, but the
#   commits that carried the fixture are still in history, so the value itself
#   is allowlisted instead of a path that no longer exists at HEAD.
# - `GOCSPX-...` is Antigravity's installed-application OAuth client secret,
#   pinned in `src/main/usage/antigravity-quota.ts`. Google does not treat an
#   installed-app "secret" as confidential: it ships inside every copy of the
#   Antigravity CLI and is required to exchange the account's own stored refresh
#   token for an access token, so it cannot be removed from the code.
regexes = [
  '''dGhlIHNhbXBsZSBub25jZQ==''',
  '''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'''
]
