# Dependabot configuration

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Africa/Lagos
    versioning-strategy: increase
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      svelte:
        patterns:
          - "svelte"
          - "@sveltejs/*"
      electron:
        patterns:
          - "electron"
          - "electron-builder"
          - "electron-vite"
          - "electron-updater"
      tooling:
        patterns:
          - "typescript"
          - "eslint"
          - "prettier"
          - "vitest"
          - "vite"
          - "tailwindcss"
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Africa/Lagos
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
