name: Promotion version

on:
  pull_request_target:
    branches:
      - nightly
    types:
      - opened
      - reopened
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: promotion-version-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  bump:
    name: Bump missing nightly version
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out dev
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Validate nightly promotion version (semver-correct)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_version="$(git show "${BASE_SHA}:package.json" | jq -r .version)"
          current_version="$(jq -r .version package.json)"
          # Semver-correct: stable 0.5.51 -> nightly 0.5.52-nightly-1 must be > stable
          # dev must be one patch ahead of nightly base, or equal for subsequent nightlies.
          BASE_BRANCH=nightly HEAD_BRANCH=dev BASE_VERSION="$base_version" \
            CURRENT_VERSION="$current_version" bun scripts/validate-release-promotion.ts
          echo "package.json $current_version is ready for nightly promotion (base $base_version)" 
