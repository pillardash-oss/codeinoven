name: Promotion version

on:
  pull_request_target:
    branches:
      - nightly
    types:
      - opened
      - reopened
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: promotion-version-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  bump:
    name: Bump missing nightly version
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out dev
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Bump version when omitted
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_version="$(git show "${BASE_SHA}:package.json" | jq -r .version)"
          current_version="$(jq -r .version package.json)"
          if BASE_BRANCH=nightly HEAD_BRANCH=dev BASE_VERSION="$base_version" \
            CURRENT_VERSION="$current_version" bun scripts/validate-release-promotion.ts; then
            echo "package.json is already ready for nightly promotion"
            exit 0
          fi

          bun run version:bump
          next_version="$(jq -r .version package.json)"
          BASE_BRANCH=nightly HEAD_BRANCH=dev BASE_VERSION="$base_version" \
            CURRENT_VERSION="$next_version" bun scripts/validate-release-promotion.ts

          git config user.name "CodeInOven release bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "CodeInOven-release-bot chore: bump version to $next_version"
          git push origin HEAD:dev
