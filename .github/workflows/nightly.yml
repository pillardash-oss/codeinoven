name: Nightly

on:
  push:
    branches:
      - nightly

permissions:
  contents: write

concurrency:
  group: nightly-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate dev promotion
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: ./.github/actions/setup

      - name: Require dev ancestry and a version bump
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          git fetch origin dev:refs/remotes/origin/dev
          if ! git merge-base --is-ancestor origin/dev HEAD; then
            echo "::error::nightly must be promoted from the current dev branch"
            exit 1
          fi
          previous="$(git show "${BEFORE_SHA}:package.json" | jq -r .version)"
          current="$(jq -r .version package.json)"
          upstream="$(git show origin/dev:package.json | jq -r .version)"
          if [ "$current" != "$upstream" ]; then
            echo "::error::nightly version $current does not match dev version $upstream"
            exit 1
          fi
          BASE_BRANCH=nightly HEAD_BRANCH=dev BASE_VERSION="$previous" CURRENT_VERSION="$current" \
            bun scripts/validate-release-promotion.ts

  version:
    name: Resolve nightly version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: validate
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      full: ${{ steps.version.outputs.full }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: ./.github/actions/setup

      - name: Determine nightly version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base="$(node -p "require('./package.json').version")"
          if ! printf '%s' "$base" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::package.json version must be stable major.minor.patch, got $base"
            exit 1
          fi
          echo "version=$base" >> "$GITHUB_OUTPUT"
          # Semver-correct: stable 0.5.51 -> nightly 0.5.52-nightly-1
          # nightly's package.json already bumped to next patch, so base is next stable.
          # N increments per base version. Supports legacy v{base}-nightly.{N} tags.
          max_n=0
          for tag in $(git ls-remote --tags origin "v${base}-nightly*" | awk '{print $2}' | sed 's|refs/tags/||'); do
            # match vX.Y.Z-nightly-N or vX.Y.Z-nightly.N
            n=$(printf '%s' "$tag" | sed -n -E "s/^v${base}-nightly[.-]([0-9]+)$/\1/p")
            if [ -n "$n" ] && [ "$n" -gt "$max_n" ] 2>/dev/null; then max_n=$n; fi
          done
          # Also check GitHub releases (covers tags not yet fetched / race)
          for tag in $(gh release list --limit 200 --json tagName --jq '.[].tagName' 2>/dev/null | grep -E "^v${base}-nightly[.-][0-9]+$" || true); do
            n=$(printf '%s' "$tag" | sed -n -E "s/^v${base}-nightly[.-]([0-9]+)$/\1/p")
            if [ -n "$n" ] && [ "$n" -gt "$max_n" ] 2>/dev/null; then max_n=$n; fi
          done
          next=$((max_n + 1))
          # Use a DOT between the channel and the counter (nightly.N): electron-updater's
          # GitHub provider derives the nightly channel from the first dot-separated
          # prerelease identifier. With a hyphen (nightly-N) the identifier is "nightly-N",
          # which never matches the configured "nightly" channel and the update check
          # fails with ERR_UPDATER_NO_PUBLISHED_VERSIONS ("No published versions on GitHub").
          echo "tag=v${base}-nightly.${next}" >> "$GITHUB_OUTPUT"
          echo "full=${base}-nightly.${next}" >> "$GITHUB_OUTPUT"
          echo "Resolved nightly tag v${base}-nightly.${next} (base $base, max existing $max_n)"

  # The build body and the publish body live in .github/actions/build-app and
  # .github/actions/publish-release. release.yml runs the same two actions with
  # the stable channel; the only channel-specific parts of this file are the
  # nightly tag resolution above and the channel passed to publish.
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs: version
    env:
      CODEINOVEN_GITHUB_CLIENT_ID: ${{ vars.CODEINOVEN_GITHUB_CLIENT_ID }}
      CODEINOVEN_BUILD_VERSION: ${{ needs.version.outputs.full }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-26
            target: mac
            arch: --arm64
            artifact: mac-arm64
            app_dir: dist/mac-arm64
          - name: Windows (x64)
            os: windows-latest
            target: win
            arch: --x64
            artifact: win-x64
            app_dir: dist/win-unpacked
          - name: Linux (x64)
            os: ubuntu-latest
            target: linux
            arch: --x64
            artifact: linux-x64
            app_dir: dist/linux-unpacked

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build and package ${{ matrix.name }}
        uses: ./.github/actions/build-app
        with:
          name: ${{ matrix.name }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          artifact: ${{ matrix.artifact }}
          app-dir: ${{ matrix.app_dir }}
          publish-channel: nightly
          build-version: ${{ needs.version.outputs.full }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  publish:
    name: Publish nightly prerelease
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # The mirror run is dispatched by .github/actions/publish-release
      # (workflow_dispatch needs Actions write on the token).
      actions: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Publish the nightly release
        uses: ./.github/actions/publish-release
        with:
          tag: ${{ needs.version.outputs.tag }}
          version: ${{ needs.version.outputs.version }}
          channel: nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOWNLOAD_MIRROR_S3_ENDPOINT: ${{ vars.DOWNLOAD_MIRROR_S3_ENDPOINT }}
