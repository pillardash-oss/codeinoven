name: Nightly

on:
  push:
    branches:
      - nightly

permissions:
  contents: write

concurrency:
  group: nightly-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate dev promotion
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Require dev ancestry and a version bump
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          git fetch origin dev:refs/remotes/origin/dev
          if ! git merge-base --is-ancestor origin/dev HEAD; then
            echo "::error::nightly must be promoted from the current dev branch"
            exit 1
          fi
          previous="$(git show "${BEFORE_SHA}:package.json" | jq -r .version)"
          current="$(jq -r .version package.json)"
          upstream="$(git show origin/dev:package.json | jq -r .version)"
          if [ "$current" != "$upstream" ]; then
            echo "::error::nightly version $current does not match dev version $upstream"
            exit 1
          fi
          BASE_BRANCH=nightly HEAD_BRANCH=dev BASE_VERSION="$previous" CURRENT_VERSION="$current" \
            bun scripts/validate-release-promotion.ts

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs: validate
    env:
      MAIN_VITE_REMOTE_API_ORIGIN: ${{ vars.REMOTE_API_ORIGIN || 'https://mobile.codeinoven.com' }}
      CODEINOVEN_GITHUB_CLIENT_ID: ${{ vars.CODEINOVEN_GITHUB_CLIENT_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
            target: mac
            arch: --arm64
            artifact: mac-arm64
            app_dir: dist/mac-arm64
          - name: Windows (x64)
            os: windows-latest
            target: win
            arch: --x64
            artifact: win-x64
            app_dir: dist/win-unpacked
          - name: Linux (x64)
            os: ubuntu-latest
            target: linux
            arch: --x64
            artifact: linux-x64
            app_dir: dist/linux-unpacked

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install Linux native launcher headers
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - name: Build production bundle
        run: bun run build:production

      - name: Package ${{ matrix.name }}
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo "::error::Missing signing credentials: CSC_LINK and CSC_KEY_PASSWORD are required"
            exit 1
          fi
          if [ "${{ matrix.target }}" = "mac" ]; then
            if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
              echo "::error::Missing mac notarization credentials: APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID"
              exit 1
            fi
          fi
          bunx electron-builder --${{ matrix.target }} ${{ matrix.arch }} --publish never -c.publish.channel=nightly -c.forceCodeSigning=true

      - name: Verify packaged artifacts
        run: bun run verify:packaged-app --target ${{ matrix.target }} --artifact-dir dist

      - name: Launch packaged application through workspace readiness
        shell: bash
        run: |
          command=(bun run smoke:packaged --target "${{ matrix.target }}" --app-dir "${{ matrix.app_dir }}" --output "agent-out/startup-smoke-${{ matrix.target }}.json")
          for attempt in 1 2 3; do
            if [ "${{ matrix.target }}" = "linux" ]; then
              xvfb-run -a "${command[@]}"
            else
              "${command[@]}"
            fi
            exit_code=$?
            if [ "$exit_code" -eq 0 ]; then
              break
            fi
            echo "startup smoke attempt $attempt failed with exit $exit_code; retrying"
            sleep 10
          done
          exit "$exit_code"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: codeinoven-${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/*.yml
            agent-out/startup-smoke-*.json
          if-no-files-found: error

  publish:
    name: Publish nightly prerelease
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine nightly version
        id: version
        run: |
          base="$(node -p "require('./package.json').version")"
          if ! printf '%s' "$base" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::package.json version must be stable major.minor.patch, got $base"
            exit 1
          fi
          echo "version=$base" >> "$GITHUB_OUTPUT"
          echo "tag=v${base}-nightly.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.dmg *.zip *.exe *.AppImage *.deb 2>/dev/null > SHA256SUMS.txt || true
          ls -la

      - name: Create or update nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            tagged_commit="$(git rev-list -n 1 "$tag")"
            if [ "$tagged_commit" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $tag already points to $tagged_commit instead of $GITHUB_SHA"
              exit 1
            fi
          fi
          files=()
          for f in artifacts/*.dmg artifacts/*.zip artifacts/*.exe artifacts/*.AppImage artifacts/*.deb artifacts/*.blockmap artifacts/*.yml artifacts/SHA256SUMS.txt; do
            [ -f "$f" ] && files+=("$f")
          done
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --title "CodeInOven $version nightly" --prerelease
          else
            gh release create "$tag" "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "CodeInOven $version nightly" \
              --notes "Prerelease build of version $version from the \`nightly\` branch. Use for testing; not intended for production." \
              --prerelease \
              --latest=false
          fi
