name: Nightly

on:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches:
      - nightly
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
            target: mac
            arch: --arm64
          - name: macOS (Intel)
            os: macos-14
            target: mac
            arch: --x64
          - name: Windows (x64)
            os: windows-latest
            target: win
            arch: --x64
          - name: Linux (x64)
            os: ubuntu-latest
            target: linux
            arch: --x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build production bundle
        run: bun run build:production

      - name: Package ${{ matrix.name }}
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          flags=()
          if [ -z "$CSC_LINK" ]; then
            flags+=(-c.forceCodeSigning=false)
          fi
          if [ "${{ matrix.target }}" = "mac" ]; then
            if [ -z "$APPLE_ID" ]; then
              flags+=(-c.mac.identity=null -c.mac.notarize=false)
            fi
          fi
          bunx electron-builder --${{ matrix.target }} ${{ matrix.arch }} --publish never -c.publish.channel=nightly "${flags[@]}"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: codeinoven-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  publish:
    name: Publish nightly prerelease
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Determine nightly version
        id: version
        run: |
          base="$(node -p "require('./package.json').version")"
          echo "version=${base}-nightly.$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.dmg *.zip *.exe *.AppImage *.deb 2>/dev/null > SHA256SUMS.txt || true
          ls -la

      - name: Create or update nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          files=()
          for f in artifacts/*.dmg artifacts/*.zip artifacts/*.exe artifacts/*.AppImage artifacts/*.deb artifacts/*.blockmap artifacts/latest*.yml artifacts/SHA256SUMS.txt; do
            [ -f "$f" ] && files+=("$f")
          done
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly "${files[@]}" --clobber
            gh release edit nightly --prerelease
          else
            gh release create nightly "${files[@]}" \
              --title "CodeInOven $version" \
              --notes "Nightly build from the \`nightly\` branch. Use for testing; not intended for production." \
              --prerelease
          fi
