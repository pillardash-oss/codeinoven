name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  validate:
    name: Validate stable version
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: ./.github/actions/setup

      - name: Validate package version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin refs/heads/nightly:refs/remotes/origin/nightly
          if ! git merge-base --is-ancestor origin/nightly HEAD; then
            echo "::error::main must be promoted from the current nightly branch"
            exit 1
          fi
          previous="$(gh release list --limit 1000 --json tagName,isPrerelease --jq '[.[] | select(.isPrerelease | not) | .tagName] | max_by(ltrimstr("v"))' | sed 's/^v//')"
          version="$(node -p "require('./package.json').version")"
          upstream="$(git show origin/nightly:package.json | jq -r .version)"
          # Semver-correct nightly: nightly's base IS the next stable version
          # (stable 0.5.52 -> 0.5.53-nightly.N -> stable 0.5.53). The version
          # being promoted must be exactly one patch ahead of the last
          # PUBLISHED stable release (main's package.json can drift).
          if [ -z "$previous" ]; then
            echo "::error::Could not determine the last published stable release"
            exit 1
          fi
          BASE_BRANCH=main HEAD_BRANCH=nightly BASE_VERSION="$previous" CURRENT_VERSION="$version" \
            bun scripts/validate-release-promotion.ts
          if [ "$version" != "$upstream" ]; then
            echo "::warning::main version $version differs from nightly version $upstream (expected nightly base to be promoted)"
          fi
          # Require at least one nightly prerelease for the version being promoted
          if ! gh release list --limit 1000 --json tagName,isPrerelease | \
            jq -e --arg base "$version" \
              'any(.[]; .isPrerelease and (.tagName | test("^v\($base)-nightly[.-][0-9]+$")))' >/dev/null; then
            echo "::error::No published nightly prerelease exists for base $version (expected v${version}-nightly-{N})"
            exit 1
          fi

  # Same two actions as nightly.yml, with the stable channel. Packaging now
  # goes through .github/actions/build-app, which cleans stale dist/ output
  # before electron-builder runs. This workflow used to package without that
  # clean even though nightly.yml documents it as required: leftover .bin
  # symlinks and old app bundles collide with electron-builder's dependency
  # traversal and fail packaging with EEXIST.
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs: validate
    env:
      CODEINOVEN_GITHUB_CLIENT_ID: ${{ vars.CODEINOVEN_GITHUB_CLIENT_ID }}
      CODEINOVEN_POSTHOG_TOKEN: ${{ vars.CODEINOVEN_POSTHOG_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-26
            target: mac
            arch: --arm64
            artifact: mac-arm64
            app_dir: dist/mac-arm64
          - name: Windows (x64)
            os: windows-latest
            target: win
            arch: --x64
            artifact: win-x64
            app_dir: dist/win-unpacked
          - name: Linux (x64)
            # Ubuntu 22.04 on purpose, not `ubuntu-latest`. The native modules
            # this job compiles (node-pty) inherit the runner's glibc, so the
            # runner's glibc becomes the floor for every user. Compiling on a
            # newer image shipped terminals that could not load on older
            # distributions while the rest of the app booted fine. The packaged
            # app is verified against GLIBC_2.35 by `bun run verify:packaged-app`.
            os: ubuntu-22.04
            target: linux
            arch: --x64
            artifact: linux-x64
            app_dir: dist/linux-unpacked
          - name: Linux (arm64)
            # GitHub's own arm64 Ubuntu 22.04 image. The architecture has to be
            # native: node-pty has no Linux prebuilds, so it is compiled by
            # node-gyp during install, and a cross-compiled Electron tree would
            # ship the x64 helper. Same 22.04 image as the x64 leg so both Linux
            # artifacts hold the same GLIBC_2.35 floor.
            os: ubuntu-22.04-arm
            target: linux
            arch: --arm64
            artifact: linux-arm64
            app_dir: dist/linux-arm64-unpacked
            artifact_name: ${name}-${version}-${arch}.${ext}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build and package ${{ matrix.name }}
        uses: ./.github/actions/build-app
        with:
          name: ${{ matrix.name }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          artifact: ${{ matrix.artifact }}
          app-dir: ${{ matrix.app_dir }}
          linux-artifact-name: ${{ matrix.artifact_name }}
          # The Microsoft Store package is built on every stable release, and
          # submitted to the Store when the submission credentials exist. A
          # Store-installed app cannot update itself (see
          # src/main/notifications/updater-service.ts), so an unsubmitted
          # package means Store users never receive the release at all.
          msix: ${{ vars.CODEINOVEN_MSIX_BUILD || vars.CODEINOVEN_MSIX_SUBMIT }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # The mirror run is dispatched by .github/actions/publish-release
      # (workflow_dispatch needs Actions write on the token).
      actions: write

    steps:
      # A stable release tag is just the branch version, so it is resolved here
      # and handed to .github/actions/publish-release, which is otherwise the
      # same action nightly.yml runs.
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: ./.github/actions/setup

      - name: Determine release tag
        id: tag
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        uses: ./.github/actions/publish-release
        with:
          tag: ${{ steps.tag.outputs.tag }}
          version: ${{ steps.tag.outputs.version }}
          channel: stable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOWNLOAD_MIRROR_S3_ENDPOINT: ${{ vars.DOWNLOAD_MIRROR_S3_ENDPOINT }}

      # The Store package stays out of the mirrored asset set (it is a submission,
      # not a download; see packaging/msix/README.md), but it is attached to the
      # release page so the Partner Center upload is one click. It runs after the
      # publish action on purpose: the mirror is dispatched from inside that
      # action and must not see an asset its checksum manifest does not cover.
      - name: Attach the Microsoft Store package
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          shopt -s nullglob
          files=(artifacts/*.msix)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No MSIX built for this release; nothing to attach."
            exit 0
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          echo "Attached ${files[*]} to $RELEASE_TAG"

  # The Store channel is updated here rather than by a human. It runs after the
  # GitHub release exists so the Store never carries a build before the release
  # it came from, and it is independent of the release job's success so a Store
  # outage cannot fail a release that already shipped to every other channel.
  #
  # Off unless the submission credentials are configured: the Microsoft Store
  # Submission API needs an Azure AD application associated with the Partner
  # Center account, and the app needs one published submission to copy. See
  # packaging/msix/README.md.
  store:
    name: Submit the Microsoft Store package
    needs: release
    if: vars.CODEINOVEN_MSIX_SUBMIT == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: ./.github/actions/setup

      # Built by the Windows leg of this same run and verified there, so it is
      # downloaded rather than rebuilt.
      - name: Download the Microsoft Store package
        uses: actions/download-artifact@v6
        with:
          name: codeinoven-msix
          path: dist

      - name: Submit to the Microsoft Store
        run: bun scripts/store-submission.ts --poll-seconds 900
        env:
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
          STORE_APP_ID: ${{ vars.STORE_APP_ID }}
