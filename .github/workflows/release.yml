name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  validate:
    name: Validate stable version
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: ./.github/actions/setup

      - name: Validate package version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin refs/heads/nightly:refs/remotes/origin/nightly
          if ! git merge-base --is-ancestor origin/nightly HEAD; then
            echo "::error::main must be promoted from the current nightly branch"
            exit 1
          fi
          previous="$(gh release list --limit 1000 --json tagName,isPrerelease --jq '[.[] | select(.isPrerelease | not) | .tagName] | max_by(ltrimstr("v"))' | sed 's/^v//')"
          version="$(node -p "require('./package.json').version")"
          upstream="$(git show origin/nightly:package.json | jq -r .version)"
          # Semver-correct nightly: nightly's base IS the next stable version
          # (stable 0.5.52 -> 0.5.53-nightly.N -> stable 0.5.53). The version
          # being promoted must be exactly one patch ahead of the last
          # PUBLISHED stable release (main's package.json can drift).
          if [ -z "$previous" ]; then
            echo "::error::Could not determine the last published stable release"
            exit 1
          fi
          BASE_BRANCH=main HEAD_BRANCH=nightly BASE_VERSION="$previous" CURRENT_VERSION="$version" \
            bun scripts/validate-release-promotion.ts
          if [ "$version" != "$upstream" ]; then
            echo "::warning::main version $version differs from nightly version $upstream (expected nightly base to be promoted)"
          fi
          # Require at least one nightly prerelease for the version being promoted
          if ! gh release list --limit 1000 --json tagName,isPrerelease | \
            jq -e --arg base "$version" \
              'any(.[]; .isPrerelease and (.tagName | test("^v\($base)-nightly[.-][0-9]+$")))' >/dev/null; then
            echo "::error::No published nightly prerelease exists for base $version (expected v${version}-nightly-{N})"
            exit 1
          fi

  # Same two actions as nightly.yml, with the stable channel. Packaging now
  # goes through .github/actions/build-app, which cleans stale dist/ output
  # before electron-builder runs. This workflow used to package without that
  # clean even though nightly.yml documents it as required: leftover .bin
  # symlinks and old app bundles collide with electron-builder's dependency
  # traversal and fail packaging with EEXIST.
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs: validate
    env:
      CODEINOVEN_GITHUB_CLIENT_ID: ${{ vars.CODEINOVEN_GITHUB_CLIENT_ID }}
      CODEINOVEN_POSTHOG_TOKEN: ${{ vars.CODEINOVEN_POSTHOG_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-26
            target: mac
            arch: --arm64
            artifact: mac-arm64
            app_dir: dist/mac-arm64
          - name: Windows (x64)
            os: windows-latest
            target: win
            arch: --x64
            artifact: win-x64
            app_dir: dist/win-unpacked
          - name: Linux (x64)
            os: ubuntu-latest
            target: linux
            arch: --x64
            artifact: linux-x64
            app_dir: dist/linux-unpacked

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build and package ${{ matrix.name }}
        uses: ./.github/actions/build-app
        with:
          name: ${{ matrix.name }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          artifact: ${{ matrix.artifact }}
          app-dir: ${{ matrix.app_dir }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # The mirror run is dispatched by .github/actions/publish-release
      # (workflow_dispatch needs Actions write on the token).
      actions: write

    steps:
      # A stable release tag is just the branch version, so it is resolved here
      # and handed to .github/actions/publish-release, which is otherwise the
      # same action nightly.yml runs.
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: ./.github/actions/setup

      - name: Determine release tag
        id: tag
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        uses: ./.github/actions/publish-release
        with:
          tag: ${{ steps.tag.outputs.tag }}
          version: ${{ steps.tag.outputs.version }}
          channel: stable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOWNLOAD_MIRROR_S3_ENDPOINT: ${{ vars.DOWNLOAD_MIRROR_S3_ENDPOINT }}
