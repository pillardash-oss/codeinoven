name: Quality

# The full suite runs exactly once per change, on the pull request that is the
# last gate before the content lands:
#   - on every pull_request (feature PRs, dev -> nightly promotion PRs)
#
# There is no `push: nightly` trigger. A dev -> nightly promotion PR merges only
# with its required "Release verification" check green under a `strict`
# (head-must-be-up-to-date) policy, and nightly carries no content of its own, so
# the merge commit's tree is exactly the tree that PR verified. Re-running the
# whole suite, and its four production builds, on the resulting push to nightly
# could only re-confirm that same content.
#
# A nightly -> main promotion PR re-delivers the exact content that just
# passed the full suite, so only the cheap "Release promotion
# policy" job runs there; the heavy jobs report "Skipped" (treated as
# passing by required-check policies). Pushes to main are excluded entirely:
# main only ever receives nightly promotion merges, which were just checked
# on the promotion PR.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job decides whether the heavy suite runs. A composite action cannot set
  # a job-level `if`, so this decision cannot live in .github/actions/setup; it
  # used to be restated verbatim on all nine heavy jobs, which meant changing
  # the policy meant nine coordinated edits.
  policy:
    name: Determine suite scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.scope.outputs.skip }}

    steps:
      - name: Decide whether the heavy suite runs
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          skip=false
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" = "nightly" ]; then
            skip=true
            echo "::notice::nightly -> main promotion re-delivers content the nightly push just fully checked and built, so the heavy suite is skipped and only the promotion policy runs."
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  promotion-policy:
    name: Release promotion policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: ./.github/actions/setup

      - name: Read promotion versions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_BRANCH: ${{ github.base_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$BASE_BRANCH" = 'main' ]; then
            # main's package.json can drift ahead of the last published stable
            # (e.g. a promotion merge that has not been released yet), so compare
            # against the last published stable release instead, exactly like
            # release.yml and scripts/deploy-main.sh do.
            base_version="$(gh release list --limit 1000 --json tagName,isPrerelease --jq '[.[] | select(.isPrerelease | not) | .tagName] | max_by(ltrimstr("v"))' | sed 's/^v//')"
            if [ -z "$base_version" ]; then
              echo "::error::Could not determine the last published stable release"
              exit 1
            fi
            echo "Resolved last published stable release: v$base_version"
          else
            base_version="$(git show "${BASE_SHA}:package.json" | jq -r .version)"
          fi
          echo "BASE_VERSION=$base_version" >> "$GITHUB_ENV"
          echo "CURRENT_VERSION=$(jq -r .version package.json)" >> "$GITHUB_ENV"

      - name: Validate branch direction and version bump
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: bun scripts/validate-release-promotion.ts

  # Dependency auditing lives in security.yml. It used to run here as well,
  # which meant every push paid for the same `bun audit` twice.
  #
  # Every job below sets up through .github/actions/setup, so there is no
  # separate install job: each one installs the locked dependency tree itself,
  # exactly as the old `install` gate's dependents already did.

  check:
    name: Type check
    needs: [policy]
    if: needs.policy.outputs.skip != 'true'
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup
        with:
          install: 'true'

      - name: Type check
        run: bun run check

  lint:
    name: Lint
    needs: [policy]
    if: needs.policy.outputs.skip != 'true'
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup
        with:
          install: 'true'

      - name: Lint
        run: bun run lint .

  test:
    name: Tests
    needs: [policy]
    if: needs.policy.outputs.skip != 'true'
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup
        with:
          install: 'true'

      - name: Tests
        run: bun run test

  build:
    name: Production build
    needs: [policy]
    if: needs.policy.outputs.skip != 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      CODEINOVEN_GITHUB_CLIENT_ID: ${{ vars.CODEINOVEN_GITHUB_CLIENT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup
        with:
          install: 'true'

      - name: Production build
        run: bun run build:production

      - name: Bundle budgets
        run: bun run check:bundle

  windows-runtime:
    name: Windows quality and packaged startup
    needs: [policy]
    if: needs.policy.outputs.skip != 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GIT_AUTHOR_NAME: CodeInOven CI
      GIT_AUTHOR_EMAIL: ci@codeinoven.invalid
      GIT_COMMITTER_NAME: CodeInOven CI
      GIT_COMMITTER_EMAIL: ci@codeinoven.invalid

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup
        with:
          install: 'true'

      - name: Type check
        run: bun run check

      - name: Tests
        run: bun run test

      - name: Build Pi harness
        shell: bash
        run: bun run harness:build-pi

      - name: Production build and bundle budgets
        shell: bash
        run: |
          bun run build:production
          bun run check:bundle

      - name: Package unpacked Windows application
        shell: bash
        run: bunx electron-builder --win --x64 --dir -c.forceCodeSigning=false

      - name: Launch packaged application through workspace readiness
        uses: ./.github/actions/startup-smoke
        with:
          target: win
          app-dir: dist/win-unpacked
          output: .cio/tmp/windows-startup-smoke.json

      - name: Upload Windows startup evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-startup-smoke
          path: .cio/tmp/windows-startup-smoke.json
          if-no-files-found: warn

  linux-runtime:
    name: Linux quality and packaged startup
    needs: [policy]
    if: needs.policy.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup
        with:
          install: 'true'

      - name: Install native launcher headers
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - name: Build Pi harness
        run: bun run harness:build-pi

      - name: Production build and bundle budgets
        run: |
          bun run build:production
          bun run check:bundle

      - name: Package unpacked Linux application
        run: bunx electron-builder --linux --x64 --dir -c.forceCodeSigning=false

      - name: Launch packaged application through workspace readiness
        uses: ./.github/actions/startup-smoke
        with:
          target: linux
          app-dir: dist/linux-unpacked
          output: .cio/tmp/linux-startup-smoke.json

      - name: Upload Linux startup evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: linux-startup-smoke
          path: .cio/tmp/linux-startup-smoke.json
          if-no-files-found: warn

  verify-release:
    name: Release verification
    needs: [policy, check, lint, test, build, windows-runtime, linux-runtime]
    # `always()` so a failed dependency still reaches the assertion below.
    # Without it GitHub skips this job when a `needs` job fails, and a skipped
    # required check counts as passing, which would let a red PR merge.
    if: always() && needs.policy.outputs.skip != 'true'
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      # This job is the required status check on `dev` and `nightly`. It used to
      # run `bun run verify:release`, which is `check && lint && test && audit &&
      # build:production && check:bundle`: every one of those had just run in a
      # job above on this same macOS image and commit, and it rebuilt the whole
      # application a second time on the critical path. It now asserts those
      # jobs' results instead.
      - name: Assert every gated job succeeded
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          WINDOWS_RESULT: ${{ needs.windows-runtime.result }}
          LINUX_RESULT: ${{ needs.linux-runtime.result }}
        run: |
          failed=0
          for entry in \
            "Type check:$CHECK_RESULT" \
            "Lint:$LINT_RESULT" \
            "Tests:$TEST_RESULT" \
            "Production build:$BUILD_RESULT" \
            "Windows quality and packaged startup:$WINDOWS_RESULT" \
            "Linux quality and packaged startup:$LINUX_RESULT"; do
            label="${entry%%:*}"
            result="${entry#*:}"
            echo "$label -> $result"
            if [ "$result" != "success" ]; then
              echo "::error::$label reported '$result'"
              failed=1
            fi
          done
          exit "$failed"

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup
        with:
          install: 'true'

      # The dependency audit lives in security.yml, which is not a required
      # check, so it is the one part of `verify:release` this gate keeps running
      # itself; everything else it used to run is covered by the jobs asserted
      # above.
      - name: Audit dependencies
        run: bun run audit
