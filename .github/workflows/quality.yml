name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - nightly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Frozen install
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

  check:
    name: Type check
    runs-on: macos-latest
    timeout-minutes: 15
    needs: install

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

  lint:
    name: Lint
    runs-on: macos-latest
    timeout-minutes: 15
    needs: install

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint .

  test:
    name: Tests
    runs-on: macos-latest
    timeout-minutes: 15
    needs: install

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Tests
        run: bun run test

  audit:
    name: Dependency audit
    runs-on: macos-latest
    timeout-minutes: 15
    needs: install

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Dependency audit
        run: bun audit

  build:
    name: Production build
    runs-on: macos-latest
    timeout-minutes: 20
    needs: install

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        run: bun run build:production

  verify-release:
    name: Release verification
    runs-on: macos-latest
    timeout-minutes: 30
    needs: [check, lint, test, audit, build]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Release verification
        run: bun run verify:release
