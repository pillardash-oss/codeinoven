name: Security

# Same policy as quality.yml: the suite runs once per change on the nightly
# side. Nightly -> main promotion PRs skip the scan jobs (identical content
# was just scanned on the nightly push), and pushes to main are excluded
# because main only ever receives nightly promotion merges.
#
# This workflow owns `bun audit`. quality.yml ran the identical command as a
# separate job, so every push paid for the same audit twice.
on:
  push:
    branches:
      - nightly
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The skip decision lives here rather than in .github/actions/setup because a
  # composite action cannot set a job-level `if`.
  policy:
    name: Determine suite scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.scope.outputs.skip }}

    steps:
      - name: Decide whether the heavy suite runs
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          skip=false
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" = "nightly" ]; then
            skip=true
            echo "::notice::nightly -> main promotion re-delivers content the nightly push just fully scanned, so the scan jobs are skipped."
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  secrets:
    name: Detect leaked secrets
    needs: [policy]
    if: needs.policy.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan for secrets with Gitleaks
        run: gitleaks detect --redact --verbose --exit-code 1

  audit:
    name: Audit dependencies
    needs: [policy]
    if: needs.policy.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup
        with:
          install: 'true'

      # `bun audit` audits every dependency, not only the production tree, so
      # this job is named for what it does. The old "Audit production
      # dependencies" name implied a --production flag it never passed.
      - name: Audit dependencies
        run: bun audit
