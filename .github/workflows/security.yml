name: Security

# Same policy as quality.yml: the suite runs once per change on the nightly
# side. Nightly -> main promotion PRs skip the scan jobs (identical content
# was just scanned on the nightly push), and pushes to main are excluded
# because main only ever receives nightly promotion merges.
#
# This workflow owns `bun audit`. quality.yml ran the identical command as a
# separate job, so every push paid for the same audit twice.
on:
  push:
    branches:
      - nightly
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The skip decision lives here rather than in .github/actions/setup because a
  # composite action cannot set a job-level `if`.
  policy:
    name: Determine suite scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.scope.outputs.skip }}

    steps:
      - name: Decide whether the heavy suite runs
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          skip=false
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$BASE_REF" = "main" ] && [ "$HEAD_REF" = "nightly" ]; then
            skip=true
            echo "::notice::nightly -> main promotion re-delivers content the nightly push just fully scanned, so the scan jobs are skipped."
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  secrets:
    name: Detect leaked secrets
    needs: [policy]
    if: needs.policy.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan for secrets with Gitleaks
        run: gitleaks detect --redact --verbose --exit-code 1

  audit:
    name: Audit dependencies
    needs: [policy]
    if: needs.policy.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun and dependencies
        uses: ./.github/actions/setup
        with:
          install: 'true'

      # `bun audit` audits every dependency, not only the production tree, so
      # this job is named for what it does. The old "Audit production
      # dependencies" name implied a --production flag it never passed.
      #
      # The command is the `audit` script, not a bare `bun audit`, so the accepted
      # advisory list has exactly one home (package.json) instead of one copy per
      # caller. It currently accepts one:
      #
      #   GHSA-ch52-4w7c-c8xp (high, CVE-2026-93748), http-cache-semantics <=4.2.0
      #   reachable only through electron-builder > dmg-builder >
      #   app-builder-lib > @electron/get@3 > got > cacheable-request. Upstream has
      #   published no fix (`first_patched_version: null`; 4.2.0 is `latest`), so
      #   `bun audit fix` reports "no published version fixes" and suggests this
      #   same flag. Every package on that path is already at its newest published
      #   version, and the only way to drop it is an @electron/get ^5 override,
      #   which is ESM-only and cannot be require()d by app-builder-lib's CJS.
      #   The advisory needs a shared cache serving one user's zeroed response to
      #   another; here it is reached only by the build-time Electron download.
      #
      # Remove the flag from the `audit` script as soon as upstream ships a fix.
      - name: Audit dependencies
        run: bun run audit
