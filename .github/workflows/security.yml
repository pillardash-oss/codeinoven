name: Security

# Same policy as quality.yml: the suite runs once per change on the nightly
# side. Nightly -> main promotion PRs skip the scan jobs (identical content
# was just scanned on the nightly push), and pushes to main are excluded
# because main only ever receives nightly promotion merges.
on:
  push:
    branches:
      - nightly
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Detect leaked secrets
    if: github.event_name != 'pull_request' || github.base_ref != 'main' || github.head_ref != 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan for secrets with Gitleaks
        run: gitleaks detect --redact --verbose --exit-code 1

  audit:
    name: Audit dependencies
    if: github.event_name != 'pull_request' || github.base_ref != 'main' || github.head_ref != 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Audit production dependencies
        run: bun audit
