name: Stale

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: stale
  cancel-in-progress: true

jobs:
  stale:
    name: Close stale issues and PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run Stale bot
        uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: |
            This issue has been inactive for 60 days. If it is still relevant,
            comment and it will be kept open. Otherwise it will be closed in 14 days.
          stale-pr-message: |
            This pull request has been inactive for 30 days. If you are still
            working on it, comment and it will be kept open. Otherwise it will
            be closed in 14 days.
          close-issue-message: "Closed due to inactivity."
          close-pr-message: "Closed due to inactivity."
          stale-issue-label: stale
          stale-pr-label: stale
          days-before-issue-stale: 60
          days-before-pr-stale: 30
          days-before-issue-close: 14
          days-before-pr-close: 14
          exempt-issue-labels: bug,security,good-first-issue,help-wanted
          exempt-pr-labels: dependencies
          operations-per-run: 200
