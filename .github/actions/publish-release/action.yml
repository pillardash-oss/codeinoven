name: Publish release
description: >-
  Turn the downloaded build artifacts into a GitHub release for either channel.
  The nightly and stable workflows ran byte-identical copies of checksums, notes,
  a publish retry loop, and a mirror dispatch; only the tag, the channel string,
  and the prerelease flags differed. Those three differences are inputs here.

inputs:
  tag:
    description: Release tag to create or update (for example `v0.5.58`).
    required: true
  version:
    description: Version shown in the release title, without the leading `v`.
    required: true
  channel:
    description: >-
      `nightly` publishes a prerelease and keeps the stable release as latest.
      `stable` publishes a full release and moves latest onto it.
    required: true
  extra-assets:
    description: >-
      Whitespace-separated shell globs of artifacts to attach in the same
      publish call as the installers, for files that are not part of
      `release-artifacts.ts paths` (the Microsoft Store package). Must be
      attached here: on a repository that enforces immutable releases, GitHub
      rejects every asset upload once the release is published.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # No dependency install: the release scripts use Bun's built-in capabilities
    # and the repository's own TypeScript modules, exactly as before.
    - name: Set up Bun
      uses: ./.github/actions/setup

    - name: Download build artifacts
      uses: actions/download-artifact@v7
      with:
        path: artifacts
        merge-multiple: true

    - name: Generate checksums
      shell: bash
      run: bun scripts/release-artifacts.ts checksums --dir artifacts

    - name: Generate release notes
      shell: bash
      env:
        GH_TOKEN: ${{ env.GH_TOKEN }}
        RELEASE_CHANNEL: ${{ inputs.channel }}
      run: |
        # Notes cover every commit since the last published release of this
        # channel, i.e. for a nightly the newest prerelease of this base version
        # (else the last stable release). The file feeds the GitHub release body
        # below, which the in-app updater also surfaces via electron-updater's
        # releaseNotes.
        if ! bun scripts/generate-release-notes.ts --channel "$RELEASE_CHANNEL" --to "$GITHUB_SHA" --out release-notes.md; then
          echo "::error::Failed to generate release notes"
          exit 1
        fi
        cat release-notes.md

    - name: Create or update release
      shell: bash
      env:
        GH_TOKEN: ${{ env.GH_TOKEN }}
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_CHANNEL: ${{ inputs.channel }}
        RELEASE_EXTRA_ASSETS: ${{ inputs.extra-assets }}
      run: |
        if [ "$RELEASE_CHANNEL" = "nightly" ]; then
          title="CodeInOven $RELEASE_VERSION nightly"
          create_flags=(--prerelease --latest=false)
          edit_flags=(--prerelease)
        else
          title="CodeInOven $RELEASE_VERSION"
          create_flags=(--latest)
          edit_flags=(--prerelease=false --latest)
        fi

        if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
          tagged_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [ "$tagged_commit" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $RELEASE_TAG already points to $tagged_commit instead of $GITHUB_SHA"
            exit 1
          fi
        fi

        files=()
        while IFS= read -r f; do
          files+=("$f")
        done < <(bun scripts/release-artifacts.ts paths --dir artifacts)

        # Extra assets travel in the same publish call on purpose: GitHub refuses
        # every asset upload once a release is published on a repository that
        # enforces immutable releases (the "Attach the Microsoft Store package"
        # step that used to follow this action failed with
        # "HTTP 422: Cannot upload assets to an immutable release").
        if [ -n "$RELEASE_EXTRA_ASSETS" ]; then
          shopt -s nullglob
          for pattern in $RELEASE_EXTRA_ASSETS; do
            for extra in $pattern; do
              files+=("$extra")
            done
          done
          shopt -u nullglob
        fi

        publish_attempt=0
        publish_exit=1
        while [ "$publish_attempt" -lt 3 ]; do
          publish_attempt=$((publish_attempt + 1))
          immutable_blocked=false
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # A release that already exists may already be published, and a
            # published release cannot gain assets at all, so only the assets it
            # is missing are uploaded: `--clobber` would fail every rerun.
            present=()
            while IFS= read -r asset; do
              present+=("$asset")
            done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            missing=()
            for file in "${files[@]}"; do
              name="${file##*/}"
              found=false
              for asset in "${present[@]}"; do
                if [ "$asset" = "$name" ]; then
                  found=true
                  break
                fi
              done
              if [ "$found" = false ]; then
                missing+=("$file")
              fi
            done
            branch_exit=0
            if [ ${#missing[@]} -gt 0 ]; then
              if ! upload_output="$(gh release upload "$RELEASE_TAG" "${missing[@]}" 2>&1)"; then
                printf '%s\n' "$upload_output"
                branch_exit=1
                if printf '%s' "$upload_output" | grep -q 'immutable release'; then
                  # Not a transient failure: a retry would be refused identically.
                  immutable_blocked=true
                  echo "::error::Release $RELEASE_TAG is published and immutable, so GitHub refuses to add ${missing[*]} to it. Re-run the release workflow from a commit whose publish call carries every asset, or delete the release and its tag and publish again."
                fi
              else
                printf '%s\n' "$upload_output"
              fi
            fi
            # Chained so a failed upload cannot be masked by a succeeding edit:
            # `publish_exit` reflects only the last command in the branch.
            if [ "$branch_exit" -eq 0 ]; then
              gh release edit "$RELEASE_TAG" --title "$title" --notes-file release-notes.md "${edit_flags[@]}"
              branch_exit=$?
            fi
            publish_exit=$branch_exit
            if [ "$immutable_blocked" = true ]; then
              break
            fi
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file release-notes.md \
              "${create_flags[@]}"
            publish_exit=$?
          fi
          if [ "$publish_exit" -eq 0 ]; then
            break
          fi
          if [ "$publish_attempt" -lt 3 ]; then
            echo "release publish attempt $publish_attempt of 3 failed with exit $publish_exit; retrying"
            sleep 10
          fi
        done
        exit "$publish_exit"

    - name: Dispatch the download mirror
      shell: bash
      env:
        GH_TOKEN: ${{ env.GH_TOKEN }}
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_CHANNEL: ${{ inputs.channel }}
      run: |
        # This release is published with GITHUB_TOKEN, and GitHub does not start a
        # workflow from an event a GITHUB_TOKEN caused, so the mirror workflow's
        # `release: published` trigger never fires for it. workflow_dispatch is
        # the documented exception, so ask for the mirror run explicitly (see
        # .github/workflows/download-mirror.yml).
        if [ -z "$DOWNLOAD_MIRROR_S3_ENDPOINT" ]; then
          echo "::warning::Download mirror: DOWNLOAD_MIRROR_S3_ENDPOINT is not set, so $RELEASE_TAG was not mirrored."
          exit 0
        fi
        gh workflow run download-mirror.yml -f tag="$RELEASE_TAG" -f channel="$RELEASE_CHANNEL"
        echo "::notice::Download mirror: dispatched for $RELEASE_TAG ($RELEASE_CHANNEL)."
